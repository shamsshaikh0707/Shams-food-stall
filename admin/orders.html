<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders - Shams Food Stall</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --bg: #f4f5f9;
            --card: #ffffff;
            --text: #1d1f2b;
            --muted: #6b7280;
            --border: #e5e7eb;

            --dark: #14151f;
            --orange: #ff7a1a;
            --orange-dark: #e56608;
            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --green: #16a34a;
            --green-dark: #15803d;
            --red: #e11d48;
            --red-dark: #be123c;
            --purple: #7c3aed;
            --grey: #6b7280;

            --radius: 16px;
            --shadow: 0 4px 20px rgba(20, 21, 31, 0.06);
            --shadow-lg: 0 10px 30px rgba(20, 21, 31, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        select {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        button:active:not(:disabled) {
            transform: scale(0.96);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        /* =========================
           CLOSED BANNER
        ========================= */

        .closed-banner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(90deg, var(--red-dark), var(--red));
            color: white;
            text-align: center;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
        }

        body.is-closed .closed-banner {
            display: flex;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: var(--dark);
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.25);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--orange), #ffb347);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .brand h1 {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.2;
        }

        .brand span {
            font-size: 12px;
            color: #9ca3af;
            font-weight: 400;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .store-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        .store-toggle-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.16);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse-green 1.8s infinite;
        }

        body.is-closed .dot {
            background: var(--red);
            animation: none;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.6); }
            70% { box-shadow: 0 0 0 9px rgba(22, 163, 74, 0); }
            100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
        }

        .dashboard-btn {
            background: var(--blue);
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .dashboard-btn:hover {
            background: var(--blue-dark);
        }

        .refresh-btn {
            background: var(--green);
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .refresh-btn:hover {
            background: var(--green-dark);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: var(--red);
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1200px;
            margin: 30px auto 60px;
            padding: 0 20px;
        }

        .page-title {
            margin-bottom: 20px;
        }

        .page-title h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .page-title p {
            color: var(--muted);
            font-size: 15px;
        }


        /* =========================
           FILTER TABS
        ========================= */

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .filter-btn {
            background: white;
            color: var(--text);
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: var(--shadow);
            border: 1.5px solid transparent;
        }

        .filter-btn:hover {
            border-color: var(--orange);
        }

        .filter-btn.active {
            background: var(--dark);
            color: white;
        }

        .filter-count {
            display: inline-block;
            min-width: 22px;
            padding: 1px 7px;
            margin-left: 6px;
            border-radius: 999px;
            background: #f3f4f6;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        .filter-btn.active .filter-count {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }


        /* =========================
           NOTIFICATION
        ========================= */

        .notification {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: var(--dark);
            color: white;
            padding: 15px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            max-width: 350px;
            box-shadow: var(--shadow-lg);
            border-left: 5px solid var(--green);
        }

        .notification.error {
            border-left-color: var(--red);
        }

        .notification.show {
            display: block;
            animation: pop-in 0.25s ease;
        }

        @keyframes pop-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }


        /* =========================
           ORDERS
        ========================= */

        .orders {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .order-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border-left: 6px solid var(--orange);
            transition: box-shadow 0.2s ease;
        }

        .order-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .order-card.status-pending { border-left-color: var(--orange); }
        .order-card.status-preparing { border-left-color: var(--blue); }
        .order-card.status-ready { border-left-color: var(--purple); }
        .order-card.status-delivered { border-left-color: var(--green); }
        .order-card.status-cancelled { border-left-color: var(--grey); opacity: 0.85; }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .order-number {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .order-date {
            color: var(--muted);
            font-size: 13px;
        }


        /* =========================
           STATUS
        ========================= */

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-pending { background: #ffedd5; color: #c2410c; }
        .badge-preparing { background: #dbeafe; color: #1d4ed8; }
        .badge-ready { background: #ede9fe; color: #6d28d9; }
        .badge-delivered { background: #dcfce7; color: #15803d; }
        .badge-cancelled { background: #f3f4f6; color: #4b5563; }

        .status-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-area label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        .status-select {
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: white;
            font-weight: 600;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .status-select:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 4px rgba(255, 122, 26, 0.12);
        }


        /* =========================
           ORDER GRID
        ========================= */

        .order-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .info-box {
            background: #f9fafb;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .info-box h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #4b5563;
            line-height: 1.7;
            font-size: 14px;
        }

        .info-box strong {
            color: var(--text);
        }

        .info-box a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 500;
        }

        .info-box a:hover {
            text-decoration: underline;
        }


        /* =========================
           ITEMS
        ========================= */

        .items-section {
            margin-bottom: 20px;
        }

        .items-section h3 {
            margin-bottom: 12px;
            font-size: 16px;
            font-weight: 600;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
        }

        .items-table th {
            background: #f3f4f6;
            padding: 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .items-table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f3;
            font-size: 14px;
        }

        .items-table tbody tr:last-child td {
            border-bottom: none;
        }

        .items-table td:last-child,
        .items-table th:last-child {
            text-align: right;
        }


        /* =========================
           BOTTOM / TOTAL
        ========================= */

        .order-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            padding-top: 18px;
            border-top: 1px dashed #d1d5db;
        }

        .note {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 14px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            padding: 10px 14px;
            border-radius: 10px;
            display: inline-block;
        }

        .note strong {
            color: var(--text);
        }

        .note.empty-note {
            background: transparent;
            border-color: transparent;
            padding-left: 0;
        }

        .total {
            font-size: 24px;
            font-weight: 700;
            white-space: nowrap;
            color: var(--orange);
        }

        .total small {
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            margin-right: 6px;
        }

        .delete-order-btn {
            background: #ffe4e8;
            color: var(--red);
            padding: 9px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            display: block;
        }

        .delete-order-btn:hover {
            background: var(--red);
            color: white;
        }


        /* =========================
           EMPTY / LOADING
        ========================= */

        .empty,
        .loading {
            background: white;
            border-radius: var(--radius);
            padding: 60px 20px;
            text-align: center;
            color: var(--muted);
            box-shadow: var(--shadow);
        }

        .empty h3 {
            color: #4b5563;
            margin-bottom: 8px;
            font-size: 20px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            header {
                flex-direction: column;
                align-items: flex-start;
                padding: 14px 16px;
                position: static;
            }

            .header-buttons {
                width: 100%;
            }

            .order-top {
                flex-direction: column;
            }

            .status-area {
                width: 100%;
            }

            .status-select {
                flex: 1;
            }

            .order-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .container {
                padding: 0 12px;
            }

            .order-card {
                padding: 16px;
            }

            .items-table th,
            .items-table td {
                padding: 9px 7px;
                font-size: 12px;
            }

            .order-bottom {
                flex-direction: column;
                align-items: stretch;
            }

            .total {
                text-align: right;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     CLOSED BANNER
========================== -->

<div class="closed-banner">
    🔴 The restaurant is currently <strong>CLOSED</strong>. Customers cannot place orders.
</div>


<!-- =========================
     HEADER
========================== -->

<header>

    <div class="brand">

        <div class="brand-logo">🍔</div>

        <div>
            <h1>Shams Food Stall</h1>
            <span>Admin Orders</span>
        </div>

    </div>


    <div class="header-buttons">

        <button
            class="store-toggle-btn"
            id="storeToggleButton"
            onclick="toggleStore()"
            title="Click to open or close the restaurant"
            disabled
        >
            <span class="dot"></span>
            <span id="storeToggleText">Checking...</span>
        </button>


        <button
            class="dashboard-btn"
            onclick="goDashboard()"
        >
            🏠 Dashboard
        </button>


        <button
            class="refresh-btn"
            onclick="loadOrders(true)"
        >
            🔄 Refresh
        </button>


        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<!-- =========================
     MAIN
========================== -->

<div class="container">


    <div class="page-title">

        <h2>
            📦 Customer Orders
        </h2>

        <p>
            View and manage all customer orders.
        </p>

    </div>


    <div
        id="filters"
        class="filters"
    ></div>


    <div
        id="orders"
        class="orders"
    >

        <div class="loading">
            Loading orders...
        </div>

    </div>


</div>


<!-- =========================
     NOTIFICATION
========================== -->

<div
    id="notification"
    class="notification"
></div>


<script>

/*
========================================
SHAMS FOOD STALL - ADMIN ORDERS
========================================

API:
    /api/orders
    /api/store-status
    /api/admin/store-status

AUTH:
    adminToken

Statuses:
    Pending
    Preparing
    Ready
    Delivered
    Cancelled
*/


const API = "/api";

const TOKEN_KEY = "adminToken";

const STATUSES = [

    "Pending",
    "Preparing",
    "Ready",
    "Delivered",
    "Cancelled"

];

let adminToken =
    localStorage.getItem(TOKEN_KEY);


/*
 * Used to detect new orders.
 */

let knownOrderIds = new Set();

let firstLoad = true;


/*
 * Current orders + filter.
 * lastSignature stops the list from
 * re-drawing when nothing changed
 * (so dropdowns don't close by themselves).
 */

let allOrders = [];

let currentFilter = "All";

let lastSignature = "";


/*
 * Restaurant open / closed.
 */

let storeOpen = true;

let storeBusy = false;


// ========================================
// START
// ========================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        checkAdminSession();

    }
);


// ========================================
// CHECK ADMIN SESSION
// ========================================

async function checkAdminSession() {

    adminToken =
        localStorage.getItem(
            TOKEN_KEY
        );


    if (!adminToken) {

        window.location.replace(
            "login.html"
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/admin/check`,
                {
                    method: "GET",

                    headers: {

                        "Authorization":
                            `Bearer ${adminToken}`

                    }
                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        if (!response.ok) {

            showNotification(
                "Unable to verify admin session.",
                true
            );

            return;

        }


        await loadStoreStatus();

        await loadOrders();

    }
    catch (error) {

        console.error(
            "Session error:",
            error
        );


        showNotification(
            "Cannot connect to backend.",
            true
        );

    }

}


// ========================================
// RESTAURANT OPEN / CLOSED
// ========================================

function setStoreUI(isOpen) {

    storeOpen = isOpen;


    document.body.classList.toggle(
        "is-closed",
        !isOpen
    );


    document.getElementById(
        "storeToggleText"
    ).textContent =
        isOpen
            ? "Open · Click to close"
            : "Closed · Click to open";


    document.getElementById(
        "storeToggleButton"
    ).disabled = storeBusy;

}


async function loadStoreStatus() {

    if (storeBusy) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/store-status`
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load store status"
            );

        }


        const data =
            await response.json();


        setStoreUI(
            data.isOpen !== false
        );

    }
    catch (error) {

        console.error(
            "Store status error:",
            error
        );

    }

}


async function toggleStore() {

    if (storeBusy) {

        return;

    }


    const makeOpen = !storeOpen;


    if (!makeOpen) {

        const confirmed =
            confirm(
                "Close the restaurant?\n\nCustomers will not be able to place new orders until you open it again."
            );


        if (!confirmed) {

            return;

        }

    }


    storeBusy = true;

    document.getElementById(
        "storeToggleButton"
    ).disabled = true;

    document.getElementById(
        "storeToggleText"
    ).textContent = "Please wait...";


    try {

        const response =
            await fetch(
                `${API}/admin/store-status`,
                {
                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${adminToken}`

                    },

                    body:
                        JSON.stringify({
                            isOpen: makeOpen
                        })

                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Failed to update restaurant status."
            );

        }


        storeOpen = result.isOpen;


        showNotification(
            result.isOpen
                ? "🟢 Restaurant is now OPEN"
                : "🔴 Restaurant is now CLOSED"
        );

    }
    catch (error) {

        console.error(
            "Toggle store error:",
            error
        );


        showNotification(
            error.message ||
            "Cannot connect to backend.",
            true
        );

    }
    finally {

        storeBusy = false;

        setStoreUI(storeOpen);

    }

}


// ========================================
// LOAD ORDERS
// ========================================

async function loadOrders(force = false) {

    const container =
        document.getElementById(
            "orders"
        );


    /*
     * Only show loading message
     * on the first load.
     */

    if (firstLoad) {

        container.innerHTML = `
            <div class="loading">
                Loading orders...
            </div>
        `;

    }


    try {

        const response =
            await fetch(
                `${API}/orders`,
                {
                    method: "GET",

                    headers: {

                        "Authorization":
                            `Bearer ${adminToken}`

                    }
                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        if (!response.ok) {

            let errorData = {};

            try {

                errorData =
                    await response.json();

            }
            catch {

                errorData = {};

            }


            throw new Error(
                errorData.message ||
                "Failed to load orders."
            );

        }


        const orders =
            await response.json();


        if (!Array.isArray(orders)) {

            throw new Error(
                "Invalid orders response."
            );

        }


        /*
         * Detect new orders.
         */

        if (!firstLoad) {

            const newOrders =
                orders.filter(
                    order =>
                        !knownOrderIds.has(
                            String(order._id)
                        )
                );


            if (newOrders.length > 0) {

                showNotification(
                    `🔔 ${newOrders.length} new order${
                        newOrders.length > 1
                            ? "s"
                            : ""
                    } received!`
                );


                playNotificationSound();


                showBrowserNotification(
                    newOrders.length
                );

            }

        }


        knownOrderIds =
            new Set(
                orders.map(
                    order =>
                        String(order._id)
                )
            );


        allOrders = orders;


        /*
         * Only re-draw when something
         * actually changed.
         */

        const signature =
            JSON.stringify(orders);


        if (
            force ||
            firstLoad ||
            signature !== lastSignature
        ) {

            lastSignature = signature;

            renderAll();

        }


        firstLoad = false;

    }
    catch (error) {

        console.error(
            "Load orders error:",
            error
        );


        if (firstLoad) {

            container.innerHTML = `
                <div class="empty">

                    <h3>
                        Failed to load orders
                    </h3>

                    <p>
                        ${escapeHtml(
                            error.message ||
                            "Please check the backend."
                        )}
                    </p>

                    <br>

                    <button
                        class="refresh-btn"
                        onclick="loadOrders(true)"
                    >
                        🔄 Try Again
                    </button>

                </div>
            `;

        }

    }

}


// ========================================
// RENDER (FILTERS + ORDERS)
// ========================================

function renderAll() {

    renderFilters();

    renderOrders();

}


function setFilter(filter) {

    currentFilter = filter;

    renderAll();

}


function renderFilters() {

    const container =
        document.getElementById(
            "filters"
        );


    const tabs =
        ["All", ...STATUSES];


    container.innerHTML =
        tabs.map(
            tab => {

                const count =
                    tab === "All"
                        ? allOrders.length
                        : allOrders.filter(
                            order =>
                                (order.status || "Pending") === tab
                        ).length;


                return `
                    <button
                        class="filter-btn ${
                            tab === currentFilter
                                ? "active"
                                : ""
                        }"
                        onclick="setFilter('${tab}')"
                    >
                        ${tab}
                        <span class="filter-count">${count}</span>
                    </button>
                `;

            }
        ).join("");

}


function renderOrders() {

    const container =
        document.getElementById(
            "orders"
        );


    if (allOrders.length === 0) {

        container.innerHTML = `
            <div class="empty">

                <h3>
                    📭 No orders yet
                </h3>

                <p>
                    Customer orders will appear here.
                </p>

            </div>
        `;

        return;

    }


    const orders =
        currentFilter === "All"
            ? allOrders
            : allOrders.filter(
                order =>
                    (order.status || "Pending") === currentFilter
            );


    if (orders.length === 0) {

        container.innerHTML = `
            <div class="empty">

                <h3>
                    No ${escapeHtml(currentFilter)} orders
                </h3>

                <p>
                    Nothing to show in this tab right now.
                </p>

            </div>
        `;

        return;

    }


    container.innerHTML =
        orders.map(
            order =>
                createOrderHTML(order)
        ).join("");

}


// ========================================
// CREATE ORDER HTML
// ========================================

function createOrderHTML(order) {

    const orderId =
        String(
            order._id || ""
        );


    const shortId =
        orderId
            ? orderId.slice(-6).toUpperCase()
            : "------";


    const customer =
        order.customer || {};


    const address =
        order.address || {};


    const items =
        Array.isArray(order.items)
            ? order.items
            : [];


    const orderDate =
        formatDate(
            order.createdAt
        );


    const addressText =
        [
            address.house,
            address.street,
            address.city,
            address.pincode
        ]
        .filter(Boolean)
        .map(escapeHtml)
        .join(", ");


    const customerName =
        escapeHtml(
            customer.name || "Unknown"
        );


    const phoneRaw =
        customer.phone || "";


    const customerPhone =
        phoneRaw
            ? `<a href="tel:${escapeHtml(phoneRaw)}">${escapeHtml(phoneRaw)}</a>`
            : "Not provided";


    const note =
        escapeHtml(
            order.note || ""
        );


    const total =
        Number(
            order.total || 0
        );


    const status =
        order.status || "Pending";


    const statusClass =
        String(status).toLowerCase();


    const itemsHTML =
        items.length > 0
            ? items.map(
                item => {

                    const itemName =
                        escapeHtml(
                            item.name || "Item"
                        );


                    const quantity =
                        Number(
                            item.quantity || 0
                        );


                    const price =
                        Number(
                            item.price || 0
                        );


                    const itemTotal =
                        price * quantity;


                    return `
                        <tr>

                            <td>
                                ${itemName}
                            </td>

                            <td>
                                ${quantity}
                            </td>

                            <td>
                                ₹${price.toFixed(2)}
                            </td>

                            <td>
                                ₹${itemTotal.toFixed(2)}
                            </td>

                        </tr>
                    `;

                }
            ).join("")
            : `
                <tr>

                    <td
                        colspan="4"
                        style="text-align:center;"
                    >
                        No items
                    </td>

                </tr>
            `;


    return `

        <div
            class="order-card status-${escapeHtml(statusClass)}"
            data-order-id="${escapeHtml(orderId)}"
        >


            <!-- ORDER TOP -->

            <div class="order-top">


                <div>

                    <div class="order-number">

                        Order #${escapeHtml(
                            shortId
                        )}

                        <span class="status-badge badge-${escapeHtml(statusClass)}">
                            ${escapeHtml(status)}
                        </span>

                    </div>


                    <div class="order-date">

                        🕒 ${escapeHtml(
                            orderDate
                        )}

                    </div>

                </div>


                <!-- STATUS -->

                <div class="status-area">

                    <label>
                        Status:
                    </label>


                    <select
                        class="status-select"
                        onchange="updateOrderStatus(
                            '${escapeJs(orderId)}',
                            this.value
                        )"
                    >

                        ${createStatusOptions(
                            status
                        )}

                    </select>

                </div>


            </div>


            <!-- CUSTOMER + ADDRESS -->

            <div class="order-grid">


                <div class="info-box">

                    <h3>
                        👤 Customer
                    </h3>

                    <p>

                        <strong>Name:</strong>
                        ${customerName}

                        <br>

                        <strong>Phone:</strong>
                        ${customerPhone}

                    </p>

                </div>


                <div class="info-box">

                    <h3>
                        📍 Delivery Address
                    </h3>

                    <p>
                        ${addressText || "Not provided"}
                    </p>

                </div>


            </div>


            <!-- ITEMS -->

            <div class="items-section">

                <h3>
                    🍽️ Ordered Items
                </h3>


                <div class="table-wrap">

                    <table class="items-table">

                        <thead>

                            <tr>

                                <th>
                                    Item
                                </th>

                                <th>
                                    Qty
                                </th>

                                <th>
                                    Price
                                </th>

                                <th>
                                    Total
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            ${itemsHTML}

                        </tbody>

                    </table>

                </div>

            </div>


            <!-- BOTTOM -->

            <div class="order-bottom">


                <div>

                    ${
                        note
                            ? `
                                <div class="note">
                                    <strong>
                                        📝 Note:
                                    </strong>
                                    ${note}
                                </div>
                            `
                            : `
                                <div class="note empty-note">
                                    No special note.
                                </div>
                            `
                    }

                    <button
                        class="delete-order-btn"
                        onclick="deleteOrder('${escapeJs(orderId)}')"
                    >
                        🗑️ Delete Order
                    </button>

                </div>


                <div class="total">

                    <small>Total</small>
                    ₹${total.toFixed(2)}

                </div>


            </div>


        </div>

    `;

}


// ========================================
// STATUS OPTIONS
// ========================================

function createStatusOptions(
    currentStatus
) {

    return STATUSES.map(
        status => `

            <option
                value="${status}"
                ${
                    status === currentStatus
                        ? "selected"
                        : ""
                }
            >
                ${status}
            </option>

        `
    ).join("");

}


// ========================================
// UPDATE STATUS
// ========================================

async function updateOrderStatus(
    orderId,
    status
) {

    if (!orderId) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/orders/${encodeURIComponent(orderId)}/status`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${adminToken}`

                    },

                    body:
                        JSON.stringify({
                            status: status
                        })

                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        let data = {};

        try {

            data =
                await response.json();

        }
        catch {

            data = {};

        }


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to update order status."
            );

        }


        showNotification(
            `Order status changed to ${status}.`
        );


        /*
         * Refresh the orders list
         * so the UI always matches DB.
         */

        await loadOrders(true);

    }
    catch (error) {

        console.error(
            "Status update error:",
            error
        );


        showNotification(
            error.message ||
            "Could not update order.",
            true
        );


        await loadOrders(true);

    }

}


// ========================================
// DELETE ORDER
// ========================================

async function deleteOrder(orderId) {

    if (!orderId) {

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this order?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/orders/${encodeURIComponent(orderId)}`,
                {

                    method: "DELETE",

                    headers: {

                        "Authorization":
                            `Bearer ${adminToken}`

                    }

                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        let data = {};

        try {

            data =
                await response.json();

        }
        catch {

            data = {};

        }


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to delete order."
            );

        }


        showNotification(
            "Order deleted successfully."
        );


        await loadOrders(true);

    }
    catch (error) {

        console.error(
            "Delete order error:",
            error
        );


        showNotification(
            error.message ||
            "Could not delete order.",
            true
        );

    }

}


// ========================================
// BROWSER NOTIFICATION
// ========================================

function showBrowserNotification(
    count
) {

    if (
        !("Notification" in window)
    ) {

        return;

    }


    if (
        Notification.permission ===
        "granted"
    ) {

        new Notification(
            "Shams Food Stall",
            {
                body:
                    `${count} new order${
                        count > 1
                            ? "s"
                            : ""
                    } received!`
            }
        );

    }
    else if (
        Notification.permission !==
        "denied"
    ) {

        Notification.requestPermission()
            .then(
                permission => {

                    if (
                        permission ===
                        "granted"
                    ) {

                        new Notification(
                            "Shams Food Stall",
                            {
                                body:
                                    `${count} new order${
                                        count > 1
                                            ? "s"
                                            : ""
                                    } received!`
                            }
                        );

                    }

                }
            );

    }

}


// ========================================
// NOTIFICATION SOUND
// ========================================

function playNotificationSound() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {

            return;

        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.frequency.value =
            800;


        oscillator.type =
            "sine";


        gain.gain.setValueAtTime(
            0.15,
            context.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + 0.5
        );


        oscillator.start();


        oscillator.stop(
            context.currentTime + 0.5
        );

    }
    catch (error) {

        console.log(
            "Notification sound unavailable."
        );

    }

}


// ========================================
// GO DASHBOARD
// ========================================

function goDashboard() {

    window.location.href =
        "index.html";

}


// ========================================
// LOGOUT
// ========================================

async function logout() {

    try {

        await fetch(
            `${API}/admin/logout`,
            {

                method: "POST",

                headers: {

                    "Authorization":
                        `Bearer ${adminToken}`

                }

            }
        );

    }
    catch (error) {

        console.error(
            "Logout error:",
            error
        );

    }


    localStorage.removeItem(
        TOKEN_KEY
    );


    window.location.replace(
        "login.html"
    );

}


// ========================================
// HANDLE UNAUTHORIZED
// ========================================

function handleUnauthorized() {

    localStorage.removeItem(
        TOKEN_KEY
    );


    adminToken = null;


    window.location.replace(
        "login.html"
    );

}


// ========================================
// SHOW NOTIFICATION
// ========================================

function showNotification(
    message,
    error = false
) {

    const box =
        document.getElementById(
            "notification"
        );


    box.textContent =
        message;


    box.classList.toggle(
        "error",
        error
    );


    box.classList.remove("show");

    // restart animation
    void box.offsetWidth;

    box.classList.add("show");


    clearTimeout(
        showNotification.timer
    );


    showNotification.timer =
        setTimeout(
            function () {

                box.classList.remove(
                    "show"
                );

            },
            3500
        );

}


// ========================================
// FORMAT DATE
// ========================================

function formatDate(
    dateValue
) {

    if (!dateValue) {

        return "Date unavailable";

    }


    const date =
        new Date(dateValue);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "Date unavailable";

    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",

            hour: "2-digit",
            minute: "2-digit",

            hour12: true
        }
    );

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


// ========================================
// ESCAPE JAVASCRIPT
// ========================================

function escapeJs(value) {

    return String(value)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        )
        .replaceAll(
            "\n",
            "\\n"
        )
        .replaceAll(
            "\r",
            "\\r"
        );

}


// ========================================
// AUTO REFRESH
// ========================================

setInterval(
    function () {

        if (
            localStorage.getItem(
                TOKEN_KEY
            )
        ) {

            loadOrders();

            loadStoreStatus();

        }

    },
    5000
);

</script>
