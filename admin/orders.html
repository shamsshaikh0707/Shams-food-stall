<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders - Shams Food Stall</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f5f5;

            color: #222;
        }


        button,
        select {
            font-family: inherit;
        }


        button {
            border: none;
            cursor: pointer;
        }


        /* =========================
           HEADER
        ========================= */

        header {

            background: #111;

            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.15);

        }


        header h1 {
            font-size: 24px;
        }


        .header-buttons {

            display: flex;

            gap: 10px;

        }


        .dashboard-btn {

            background: #1976d2;

            color: white;

            padding: 11px 18px;

            border-radius: 7px;

            font-weight: bold;

        }


        .dashboard-btn:hover {
            background: #1565c0;
        }


        .refresh-btn {

            background: #2e7d32;

            color: white;

            padding: 11px 18px;

            border-radius: 7px;

            font-weight: bold;

        }


        .refresh-btn:hover {
            background: #1b5e20;
        }


        .logout-btn {

            background: #e53935;

            color: white;

            padding: 11px 18px;

            border-radius: 7px;

            font-weight: bold;

        }


        .logout-btn:hover {
            background: #c62828;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            max-width: 1200px;

            margin: 30px auto;

            padding: 0 20px;

        }


        .page-title {

            margin-bottom: 25px;

        }


        .page-title h2 {

            margin-bottom: 6px;

        }


        .page-title p {

            color: #666;

        }


        /* =========================
           NOTIFICATION
        ========================= */

        .notification {

            display: none;

            position: fixed;

            top: 20px;

            right: 20px;

            z-index: 9999;

            background: #2e7d32;

            color: white;

            padding: 15px 20px;

            border-radius: 8px;

            font-weight: bold;

            max-width: 350px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.25);

        }


        /* =========================
           ORDERS
        ========================= */

        .orders {

            display: flex;

            flex-direction: column;

            gap: 20px;

        }


        .order-card {

            background: white;

            border-radius: 10px;

            padding: 22px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);

            border-left: 5px solid #ff9800;

        }


        .order-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 18px;

        }


        .order-number {

            font-size: 19px;

            font-weight: bold;

            margin-bottom: 6px;

        }


        .order-date {

            color: #777;

            font-size: 14px;

        }


        /* =========================
           STATUS
        ========================= */

        .status-area {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .status-area label {

            font-size: 13px;

            font-weight: bold;

            color: #666;

        }


        .status-select {

            padding: 9px 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: white;

            font-weight: bold;

            outline: none;

            cursor: pointer;

        }


        .status-select:focus {

            border-color: #1976d2;

        }


        /* =========================
           ORDER GRID
        ========================= */

        .order-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

            margin-bottom: 20px;

        }


        .info-box {

            background: #f8f8f8;

            border-radius: 8px;

            padding: 15px;

        }


        .info-box h3 {

            font-size: 16px;

            margin-bottom: 10px;

        }


        .info-box p {

            color: #555;

            line-height: 1.6;

            font-size: 14px;

        }


        .info-box strong {

            color: #222;

        }


        /* =========================
           ITEMS
        ========================= */

        .items-section {

            margin-top: 5px;

            margin-bottom: 20px;

        }


        .items-section h3 {

            margin-bottom: 12px;

            font-size: 17px;

        }


        .items-table {

            width: 100%;

            border-collapse: collapse;

        }


        .items-table th {

            background: #f1f1f1;

            padding: 11px;

            text-align: left;

            font-size: 13px;

        }


        .items-table td {

            padding: 11px;

            border-bottom:
                1px solid #eee;

            font-size: 14px;

        }


        .items-table td:last-child,
        .items-table th:last-child {

            text-align: right;

        }


        /* =========================
           TOTAL
        ========================= */

        .order-bottom {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding-top: 15px;

            border-top:
                1px solid #ddd;

        }


        .note {

            color: #666;

            font-size: 14px;

        }


        .note strong {

            color: #222;

        }


        .total {

            font-size: 22px;

            font-weight: bold;

            white-space: nowrap;

        }


        /* =========================
           DELETE
        ========================= */

        .delete-order-btn {

            background: #e53935;

            color: white;

            padding: 9px 14px;

            border-radius: 6px;

            font-weight: bold;

        }


        .delete-order-btn:hover {

            background: #c62828;

        }


        /* =========================
           EMPTY
        ========================= */

        .empty {

            background: white;

            border-radius: 10px;

            padding: 60px 20px;

            text-align: center;

            color: #777;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);

        }


        .empty h3 {

            color: #555;

            margin-bottom: 8px;

        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            background: white;

            border-radius: 10px;

            padding: 60px 20px;

            text-align: center;

            color: #777;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            header {

                flex-direction: column;

                gap: 15px;

                text-align: center;

            }


            .header-buttons {

                width: 100%;

            }


            .header-buttons button {

                flex: 1;

            }


            .order-top {

                flex-direction: column;

            }


            .status-area {

                width: 100%;

            }


            .status-select {

                flex: 1;

            }


            .order-grid {

                grid-template-columns: 1fr;

            }

        }


        @media (max-width: 600px) {

            .container {

                padding: 0 12px;

            }


            .order-card {

                padding: 15px;

            }


            .header-buttons {

                flex-direction: column;

            }


            .header-buttons button {

                width: 100%;

            }


            .items-table {

                font-size: 12px;

            }


            .items-table th,
            .items-table td {

                padding: 8px 5px;

            }


            .order-bottom {

                flex-direction: column;

                align-items: stretch;

            }


            .total {

                text-align: right;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================== -->

<header>

    <h1>
        🍔 Shams Food Stall
    </h1>


    <div class="header-buttons">

        <button
            class="dashboard-btn"
            onclick="goDashboard()"
        >
            🏠 Dashboard
        </button>


        <button
            class="refresh-btn"
            onclick="loadOrders()"
        >
            🔄 Refresh
        </button>


        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<!-- =========================
     MAIN
========================== -->

<div class="container">


    <div class="page-title">

        <h2>
            📦 Customer Orders
        </h2>

        <p>
            View and manage all customer orders.
        </p>

    </div>


    <div
        id="orders"
        class="orders"
    >

        <div class="loading">
            Loading orders...
        </div>

    </div>


</div>


<!-- =========================
     NOTIFICATION
========================== -->

<div
    id="notification"
    class="notification"
></div>


<script>

/*
========================================
SHAMS FOOD STALL - ADMIN ORDERS
========================================

API:
    /api/orders

AUTH:
    adminToken

Statuses:
    Pending
    Preparing
    Ready
    Delivered
    Cancelled
*/


const API = "/api";

const TOKEN_KEY = "adminToken";

let adminToken =
    localStorage.getItem(TOKEN_KEY);


/*
 * Used to detect new orders.
 */

let knownOrderIds = new Set();

let firstLoad = true;


// ========================================
// START
// ========================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        checkAdminSession();

    }
);


// ========================================
// CHECK ADMIN SESSION
// ========================================

async function checkAdminSession() {

    adminToken =
        localStorage.getItem(
            TOKEN_KEY
        );


    if (!adminToken) {

        window.location.replace(
            "login.html"
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/admin/check`,
                {
                    method: "GET",

                    headers: {

                        "Authorization":
                            `Bearer ${adminToken}`

                    }
                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        if (!response.ok) {

            showNotification(
                "Unable to verify admin session.",
                true
            );

            return;

        }


        await loadOrders();

    }
    catch (error) {

        console.error(
            "Session error:",
            error
        );


        showNotification(
            "Cannot connect to backend.",
            true
        );

    }

}


// ========================================
// LOAD ORDERS
// ========================================

async function loadOrders() {

    const container =
        document.getElementById(
            "orders"
        );


    /*
     * Only show loading message
     * on the first load.
     */

    if (firstLoad) {

        container.innerHTML = `
            <div class="loading">
                Loading orders...
            </div>
        `;

    }


    try {

        const response =
            await fetch(
                `${API}/orders`,
                {
                    method: "GET",

                    headers: {

                        "Authorization":
                            `Bearer ${adminToken}`

                    }
                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        if (!response.ok) {

            let errorData = {};

            try {

                errorData =
                    await response.json();

            }
            catch {

                errorData = {};

            }


            throw new Error(
                errorData.message ||
                "Failed to load orders."
            );

        }


        const orders =
            await response.json();


        if (!Array.isArray(orders)) {

            throw new Error(
                "Invalid orders response."
            );

        }


        /*
         * Detect new orders.
         */

        if (!firstLoad) {

            const newOrders =
                orders.filter(
                    order =>
                        !knownOrderIds.has(
                            String(order._id)
                        )
                );


            if (newOrders.length > 0) {

                showNotification(
                    `🔔 ${newOrders.length} new order${
                        newOrders.length > 1
                            ? "s"
                            : ""
                    } received!`
                );


                playNotificationSound();


                showBrowserNotification(
                    newOrders.length
                );

            }

        }


        knownOrderIds =
            new Set(
                orders.map(
                    order =>
                        String(order._id)
                )
            );


        renderOrders(orders);


        firstLoad = false;

    }
    catch (error) {

        console.error(
            "Load orders error:",
            error
        );


        if (firstLoad) {

            container.innerHTML = `
                <div class="empty">

                    <h3>
                        Failed to load orders
                    </h3>

                    <p>
                        ${escapeHtml(
                            error.message ||
                            "Please check the backend."
                        )}
                    </p>

                    <br>

                    <button
                        class="refresh-btn"
                        onclick="loadOrders()"
                    >
                        🔄 Try Again
                    </button>

                </div>
            `;

        }

    }

}


// ========================================
// RENDER ORDERS
// ========================================

function renderOrders(orders) {

    const container =
        document.getElementById(
            "orders"
        );


    if (orders.length === 0) {

        container.innerHTML = `
            <div class="empty">

                <h3>
                    📭 No orders yet
                </h3>

                <p>
                    Customer orders will appear here.
                </p>

            </div>
        `;

        return;

    }


    container.innerHTML =
        orders.map(
            order =>
                createOrderHTML(order)
        ).join("");

}


// ========================================
// CREATE ORDER HTML
// ========================================

function createOrderHTML(order) {

    const orderId =
        String(
            order._id || ""
        );


    const shortId =
        orderId
            ? orderId.slice(-6).toUpperCase()
            : "------";


    const customer =
        order.customer || {};


    const address =
        order.address || {};


    const items =
        Array.isArray(order.items)
            ? order.items
            : [];


    const orderDate =
        formatDate(
            order.createdAt
        );


    const addressText =
        [
            address.house,
            address.street,
            address.city,
            address.pincode
        ]
        .filter(Boolean)
        .map(escapeHtml)
        .join(", ");


    const customerName =
        escapeHtml(
            customer.name || "Unknown"
        );


    const customerPhone =
        escapeHtml(
            customer.phone || "Not provided"
        );


    const note =
        escapeHtml(
            order.note || ""
        );


    const total =
        Number(
            order.total || 0
        );


    const status =
        order.status || "Pending";


    const itemsHTML =
        items.length > 0
            ? items.map(
                item => {

                    const itemName =
                        escapeHtml(
                            item.name || "Item"
                        );


                    const quantity =
                        Number(
                            item.quantity || 0
                        );


                    const price =
                        Number(
                            item.price || 0
                        );


                    const itemTotal =
                        price * quantity;


                    return `
                        <tr>

                            <td>
                                ${itemName}
                            </td>

                            <td>
                                ${quantity}
                            </td>

                            <td>
                                ₹${price.toFixed(2)}
                            </td>

                            <td>
                                ₹${itemTotal.toFixed(2)}
                            </td>

                        </tr>
                    `;

                }
            ).join("")
            : `
                <tr>

                    <td
                        colspan="4"
                        style="text-align:center;"
                    >
                        No items
                    </td>

                </tr>
            `;


    return `

        <div
            class="order-card"
            data-order-id="${escapeHtml(orderId)}"
        >


            <!-- ORDER TOP -->

            <div class="order-top">


                <div>

                    <div class="order-number">

                        Order #${escapeHtml(
                            shortId
                        )}

                    </div>


                    <div class="order-date">

                        ${escapeHtml(
                            orderDate
                        )}

                    </div>

                </div>


                <!-- STATUS -->

                <div class="status-area">

                    <label>
                        Status:
                    </label>


                    <select
                        class="status-select"
                        onchange="updateOrderStatus(
                            '${escapeJs(orderId)}',
                            this.value
                        )"
                    >

                        ${createStatusOptions(
                            status
                        )}

                    </select>

                </div>


            </div>


            <!-- CUSTOMER + ADDRESS -->

            <div class="order-grid">


                <div class="info-box">

                    <h3>
                        👤 Customer
                    </h3>

                    <p>

                        <strong>Name:</strong>
                        ${customerName}

                        <br>

                        <strong>Phone:</strong>
                        ${customerPhone}

                    </p>

                </div>


                <div class="info-box">

                    <h3>
                        📍 Delivery Address
                    </h3>

                    <p>
                        ${addressText || "Not provided"}
                    </p>

                </div>


            </div>


            <!-- ITEMS -->

            <div class="items-section">

                <h3>
                    🍽️ Ordered Items
                </h3>


                <table class="items-table">

                    <thead>

                        <tr>

                            <th>
                                Item
                            </th>

                            <th>
                                Qty
                            </th>

                            <th>
                                Price
                            </th>

                            <th>
                                Total
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${itemsHTML}

                    </tbody>

                </table>

            </div>


            <!-- BOTTOM -->

            <div class="order-bottom">


                <div>

                    ${
                        note
                            ? `
                                <div class="note">
                                    <strong>
                                        📝 Note:
                                    </strong>
                                    ${note}
                                </div>
                            `
                            : `
                                <div class="note">
                                    No special note.
                                </div>
                            `
                    }

                    <br>

                    <button
                        class="delete-order-btn"
                        onclick="deleteOrder('${escapeJs(orderId)}')"
                    >
                        🗑️ Delete Order
                    </button>

                </div>


                <div class="total">

                    Total:
                    ₹${total.toFixed(2)}

                </div>


            </div>


        </div>

    `;

}


// ========================================
// STATUS OPTIONS
// ========================================

function createStatusOptions(
    currentStatus
) {

    const statuses = [

        "Pending",
        "Preparing",
        "Ready",
        "Delivered",
        "Cancelled"

    ];


    return statuses.map(
        status => `

            <option
                value="${status}"
                ${
                    status === currentStatus
                        ? "selected"
                        : ""
                }
            >
                ${status}
            </option>

        `
    ).join("");

}


// ========================================
// UPDATE STATUS
// ========================================

async function updateOrderStatus(
    orderId,
    status
) {

    if (!orderId) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/orders/${encodeURIComponent(orderId)}/status`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${adminToken}`

                    },

                    body:
                        JSON.stringify({
                            status: status
                        })

                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        let data = {};

        try {

            data =
                await response.json();

        }
        catch {

            data = {};

        }


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to update order status."
            );

        }


        showNotification(
            `Order status changed to ${status}.`
        );


        /*
         * Refresh the orders list
         * so the UI always matches DB.
         */

        await loadOrders();

    }
    catch (error) {

        console.error(
            "Status update error:",
            error
        );


        alert(
            error.message ||
            "Could not update order."
        );


        await loadOrders();

    }

}


// ========================================
// DELETE ORDER
// ========================================

async function deleteOrder(orderId) {

    if (!orderId) {

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this order?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/orders/${encodeURIComponent(orderId)}`,
                {

                    method: "DELETE",

                    headers: {

                        "Authorization":
                            `Bearer ${adminToken}`

                    }

                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        let data = {};

        try {

            data =
                await response.json();

        }
        catch {

            data = {};

        }


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to delete order."
            );

        }


        showNotification(
            "Order deleted successfully."
        );


        await loadOrders();

    }
    catch (error) {

        console.error(
            "Delete order error:",
            error
        );


        alert(
            error.message ||
            "Could not delete order."
        );

    }

}


// ========================================
// BROWSER NOTIFICATION
// ========================================

function showBrowserNotification(
    count
) {

    if (
        !("Notification" in window)
    ) {

        return;

    }


    if (
        Notification.permission ===
        "granted"
    ) {

        new Notification(
            "Shams Food Stall",
            {
                body:
                    `${count} new order${
                        count > 1
                            ? "s"
                            : ""
                    } received!`
            }
        );

    }
    else if (
        Notification.permission !==
        "denied"
    ) {

        Notification.requestPermission()
            .then(
                permission => {

                    if (
                        permission ===
                        "granted"
                    ) {

                        new Notification(
                            "Shams Food Stall",
                            {
                                body:
                                    `${count} new order${
                                        count > 1
                                            ? "s"
                                            : ""
                                    } received!`
                            }
                        );

                    }

                }
            );

    }

}


// ========================================
// NOTIFICATION SOUND
// ========================================

function playNotificationSound() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {

            return;

        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.frequency.value =
            800;


        oscillator.type =
            "sine";


        gain.gain.setValueAtTime(
            0.15,
            context.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            context.currentTime + 0.5
        );


        oscillator.start();


        oscillator.stop(
            context.currentTime + 0.5
        );

    }
    catch (error) {

        console.log(
            "Notification sound unavailable."
        );

    }

}


// ========================================
// GO DASHBOARD
// ========================================

function goDashboard() {

    window.location.href =
        "index.html";

}


// ========================================
// LOGOUT
// ========================================

async function logout() {

    try {

        await fetch(
            `${API}/admin/logout`,
            {

                method: "POST",

                headers: {

                    "Authorization":
                        `Bearer ${adminToken}`

                }

            }
        );

    }
    catch (error) {

        console.error(
            "Logout error:",
            error
        );

    }


    localStorage.removeItem(
        TOKEN_KEY
    );


    window.location.replace(
        "login.html"
    );

}


// ========================================
// HANDLE UNAUTHORIZED
// ========================================

function handleUnauthorized() {

    localStorage.removeItem(
        TOKEN_KEY
    );


    adminToken = null;


    window.location.replace(
        "login.html"
    );

}


// ========================================
// SHOW NOTIFICATION
// ========================================

function showNotification(
    message,
    error = false
) {

    const box =
        document.getElementById(
            "notification"
        );


    box.textContent =
        message;


    box.style.background =
        error
            ? "#e53935"
            : "#2e7d32";


    box.style.display =
        "block";


    setTimeout(
        function () {

            box.style.display =
                "none";

        },
        3500
    );

}


// ========================================
// FORMAT DATE
// ========================================

function formatDate(
    dateValue
) {

    if (!dateValue) {

        return "Date unavailable";

    }


    const date =
        new Date(dateValue);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "Date unavailable";

    }


    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",

            hour: "2-digit",
            minute: "2-digit",

            hour12: true
        }
    );

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


// ========================================
// ESCAPE JAVASCRIPT
// ========================================

function escapeJs(value) {

    return String(value)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        )
        .replaceAll(
            "\n",
            "\\n"
        )
        .replaceAll(
            "\r",
            "\\r"
        );

}


// ========================================
// AUTO REFRESH
// ========================================

setInterval(
    function () {

        if (
            localStorage.getItem(
                TOKEN_KEY
            )
        ) {

            loadOrders();

        }

    },
    5000
);

</script>
