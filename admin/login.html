<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - Shams Food Stall</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            --dark: #14151f;
            --orange: #ff7a1a;
            --orange-dark: #e56608;
            --text: #1d1f2b;
            --muted: #6b7280;
            --border: #e5e7eb;
            --red: #e11d48;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Poppins", Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 122, 26, 0.35), transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(255, 179, 71, 0.25), transparent 45%),
                linear-gradient(135deg, #14151f, #272a3d);
        }

        button,
        input {
            font-family: inherit;
        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            animation: card-in 0.5s ease;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }


        /* =========================
           HEADER
        ========================= */

        .login-header {
            background: linear-gradient(135deg, var(--dark), #2a2d42);
            color: white;
            padding: 36px 25px 32px;
            text-align: center;
        }

        .brand-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 14px;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--orange), #ffb347);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 10px 25px rgba(255, 122, 26, 0.4);
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .login-header p {
            color: #9ca3af;
            font-size: 14px;
        }


        /* =========================
           BODY
        ========================= */

        .login-body {
            padding: 34px;
        }

        .login-body h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .login-sub {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 24px;
        }


        /* =========================
           ERROR
        ========================= */

        .error-message {
            display: none;
            background: #ffe4e8;
            color: #be123c;
            border: 1px solid #fecdd3;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
        }

        .error-message.show {
            display: block;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px 13px 44px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #fafafa;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--orange);
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 122, 26, 0.12);
        }

        .password-input {
            padding-right: 48px !important;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 6px 8px;
            border-radius: 8px;
        }

        .toggle-password:hover {
            background: #f3f4f6;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 122, 26, 0.35);
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .login-button:hover:not(:disabled) {
            box-shadow: 0 10px 26px rgba(255, 122, 26, 0.5);
            transform: translateY(-1px);
        }

        .login-button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }


        /* =========================
           BACK LINK
        ========================= */

        .back-link-container {
            text-align: center;
            margin-top: 24px;
        }

        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--orange);
        }


        /* =========================
           LOADING
        ========================= */

        .loading-text {
            display: none;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .loading-text.show {
            display: block;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            .login-header {
                padding: 28px 20px 26px;
            }

            .login-body {
                padding: 26px 20px;
            }

            .brand-icon {
                width: 66px;
                height: 66px;
                font-size: 34px;
            }

            .login-header h1 {
                font-size: 22px;
            }

        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="login-header">

        <div class="brand-icon">
            🍔
        </div>

        <h1>
            Shams Food Stall
        </h1>

        <p>
            Admin Panel
        </p>

    </div>


    <!-- =========================
         BODY
    ========================== -->

    <div class="login-body">

        <h2>
            Welcome back 👋
        </h2>

        <p class="login-sub">
            Sign in to manage your restaurant.
        </p>


        <div
            id="error-message"
            class="error-message"
        ></div>


        <div
            id="loading-text"
            class="loading-text"
        >
            Checking existing session...
        </div>


        <form id="login-form">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrap">

                    <span class="input-icon">👤</span>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                        autocomplete="username"
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrap">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        id="toggle-password"
                        class="toggle-password"
                        aria-label="Show or hide password"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                id="login-button"
                class="login-button"
            >
                🔐 Login
            </button>


        </form>


        <!-- BACK -->

        <div class="back-link-container">

            <a
                href="../frontend/"
                class="back-link"
            >
                ← Back to customer website
            </a>

        </div>

    </div>

</div>


<script>

/*
========================================
SHAMS FOOD STALL ADMIN LOGIN
========================================

IMPORTANT:

The same token key is used by:

admin/login.html
admin/index.html
admin/orders.html

Do NOT change this key.
*/

const API = "/api";

const TOKEN_KEY = "adminToken";


// ========================================
// ELEMENTS
// ========================================

const loginForm =
    document.getElementById(
        "login-form"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "login-button"
    );


const errorMessage =
    document.getElementById(
        "error-message"
    );


const loadingText =
    document.getElementById(
        "loading-text"
    );


const togglePasswordButton =
    document.getElementById(
        "toggle-password"
    );


// ========================================
// SHOW / HIDE PASSWORD
// ========================================

togglePasswordButton.addEventListener(
    "click",
    function () {

        const hidden =
            passwordInput.type === "password";


        passwordInput.type =
            hidden
                ? "text"
                : "password";


        togglePasswordButton.textContent =
            hidden
                ? "🙈"
                : "👁️";

    }
);


// ========================================
// SHOW ERROR
// ========================================

function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.classList.remove(
        "show"
    );

    // restart shake animation
    void errorMessage.offsetWidth;

    errorMessage.classList.add(
        "show"
    );

}


// ========================================
// HIDE ERROR
// ========================================

function hideError() {

    errorMessage.textContent =
        "";

    errorMessage.classList.remove(
        "show"
    );

}


// ========================================
// CHECK EXISTING LOGIN
// ========================================

async function checkExistingLogin() {

    const token =
        localStorage.getItem(
            TOKEN_KEY
        );


    if (!token) {

        return;

    }


    loadingText.classList.add(
        "show"
    );


    try {

        const response =
            await fetch(
                `${API}/admin/check`,
                {
                    method: "GET",

                    headers: {

                        "Authorization":
                            `Bearer ${token}`

                    }
                }
            );


        if (response.ok) {

            /*
             * Already logged in.
             * Go directly to dashboard.
             */

            window.location.replace(
                "index.html"
            );

            return;

        }


        /*
         * Token is invalid.
         */

        localStorage.removeItem(
            TOKEN_KEY
        );

    }
    catch (error) {

        console.error(
            "Session check error:",
            error
        );

        /*
         * Do not block login if
         * session checking fails.
         */

    }
    finally {

        loadingText.classList.remove(
            "show"
        );

    }

}


// ========================================
// LOGIN
// ========================================

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        hideError();


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        if (!username) {

            showError(
                "Please enter your username."
            );

            usernameInput.focus();

            return;

        }


        if (!password) {

            showError(
                "Please enter your password."
            );

            passwordInput.focus();

            return;

        }


        /*
         * Disable button while
         * login request is running.
         */

        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        try {

            const response =
                await fetch(
                    `${API}/admin/login`,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                password:
                                    password

                            })

                    }
                );


            let data = {};

            try {

                data =
                    await response.json();

            }
            catch {

                data = {};

            }


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Invalid username or password."
                );

            }


            if (!data.token) {

                throw new Error(
                    "Login successful, but the server did not return a token."
                );

            }


            /*
             * IMPORTANT:
             * Store token using the SAME
             * key used everywhere else.
             */

            localStorage.setItem(
                TOKEN_KEY,
                data.token
            );


            /*
             * Go to admin dashboard.
             */

            window.location.replace(
                "index.html"
            );

        }
        catch (error) {

            console.error(
                "Login error:",
                error
            );


            showError(
                error.message ||
                "Unable to login. Please try again."
            );


            loginButton.disabled =
                false;

            loginButton.textContent =
                "🔐 Login";

        }

    }
);


// ========================================
// START
// ========================================

checkExistingLogin();

</script>


</body>
</html>
