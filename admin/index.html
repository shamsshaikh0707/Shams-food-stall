<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shams Restaurant - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        /* ================= HEADER ================= */

        header {
            background: #111;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            gap: 20px;
        }

        header h1 {
            font-size: 24px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .orders-btn {
            background: #ff9800;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .orders-btn:hover {
            background: #f57c00;
        }

        .logout-btn {
            background: #e53935;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #c62828;
        }

        /* ================= MAIN ================= */

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 6px;
        }

        .welcome p {
            color: #666;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            color: #777;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
        }

        .pending-number {
            color: #ff9800;
        }

        /* ================= SECTION ================= */

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .section-header h2 {
            font-size: 22px;
        }

        .add-btn {
            background: #2e7d32;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #1b5e20;
        }

        /* ================= SEARCH ================= */

        .search-area {
            margin-bottom: 25px;
        }

        .search-box {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .search-box:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 2px rgba(25,118,210,0.1);
        }

        .search-result {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }

        /* ================= FORM ================= */

        .product-form {
            display: none;
            background: #f7f7f7;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
        }

        .product-form.active {
            display: block;
        }

        .product-form h3 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 2fr;
            gap: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1976d2;
        }

        .availability {
            margin: 18px 0;
        }

        .availability label {
            cursor: pointer;
            font-weight: bold;
        }

        .availability input {
            margin-right: 7px;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .save-btn {
            background: #1976d2;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            font-weight: bold;
        }

        .save-btn:hover {
            background: #1565c0;
        }

        .cancel-btn {
            background: #777;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #555;
        }

        /* ================= PRODUCTS ================= */

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .product-image,
        .no-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .no-image {
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            margin-bottom: 8px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #1976d2;
            margin-bottom: 8px;
        }

        .available {
            color: #198754;
            font-weight: bold;
        }

        .unavailable {
            color: #dc3545;
            font-weight: bold;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .edit-btn {
            background: #1976d2;
            color: white;
            padding: 9px 13px;
            border-radius: 6px;
            font-weight: bold;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            padding: 9px 13px;
            border-radius: 6px;
            font-weight: bold;
        }

        .edit-btn:hover {
            background: #1565c0;
        }

        .delete-btn:hover {
            background: #bb2d3b;
        }

        /* ================= EMPTY / LOADING ================= */

        .empty,
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        /* ================= NOTIFICATION ================= */

        .notification {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #198754;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
            z-index: 9999;
            max-width: 350px;
        }

        .notification.error {
            background: #dc3545;
        }

        .notification.show {
            display: block;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>🍔 Shams Restaurant - Admin</h1>

    <div class="header-buttons">

        <button
            class="orders-btn"
            onclick="goOrders()"
        >
            📦 Orders
            <span id="headerPendingCount"></span>
        </button>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<main class="container">

    <div class="welcome">

        <h2>Welcome, Admin 👋</h2>

        <p>
            Manage your restaurant products and customer orders here.
        </p>

    </div>


    <!-- ================= STATS ================= -->

    <div class="stats">

        <div class="stat-card">

            <h3>Total Products</h3>

            <p id="totalProducts">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>Available Products</h3>

            <p id="availableProducts">
                0
            </p>

        </div>


        <div
            class="stat-card"
            onclick="goOrders()"
            style="cursor:pointer;"
        >

            <h3>Pending Orders</h3>

            <p
                id="pendingOrders"
                class="pending-number"
            >
                0
            </p>

        </div>

    </div>


    <!-- ================= PRODUCTS ================= -->

    <section class="section">

        <div class="section-header">

            <h2>🍔 Products</h2>

            <button
                class="add-btn"
                onclick="showAddForm()"
            >
                + Add Product
            </button>

        </div>


        <!-- SEARCH -->

        <div class="search-area">

            <input
                type="text"
                id="productSearch"
                class="search-box"
                placeholder="🔍 Search products..."
                autocomplete="off"
            >

            <div
                id="searchResult"
                class="search-result"
            ></div>

        </div>


        <!-- PRODUCT FORM -->

        <div
            id="productForm"
            class="product-form"
        >

            <h3 id="formTitle">
                Add New Product
            </h3>


            <div class="form-grid">

                <div class="form-group">

                    <label for="productName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Chicken Biryani"
                    >

                </div>


                <div class="form-group">

                    <label for="productPrice">
                        Price
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        min="0"
                        step="1"
                        placeholder="150"
                    >

                </div>


                <div class="form-group">

                    <label for="productImage">
                        Image URL
                    </label>

                    <input
                        type="url"
                        id="productImage"
                        placeholder="https://..."
                    >

                </div>

            </div>


            <div class="availability">

                <label>

                    <input
                        type="checkbox"
                        id="productAvailable"
                        checked
                    >

                    Product Available

                </label>

            </div>


            <div class="form-buttons">

                <button
                    class="save-btn"
                    id="saveProductButton"
                    onclick="saveProduct()"
                >
                    Save Product
                </button>

                <button
                    class="cancel-btn"
                    onclick="cancelForm()"
                >
                    Cancel
                </button>

            </div>

        </div>


        <!-- PRODUCTS -->

        <div
            id="products"
            class="products"
        >

            <div class="loading">
                Loading products...
            </div>

        </div>

    </section>

</main>


<div
    id="notification"
    class="notification"
></div>


<script>

    /* =====================================================
       CONFIG
    ===================================================== */

    const API = "/api";

    const TOKEN_KEY = "adminToken";

    const adminToken =
        localStorage.getItem(TOKEN_KEY);


    let allProducts = [];

    let editingProductId = null;

    let lastPendingCount = 0;


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHtml(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function handleUnauthorized() {

        localStorage.removeItem(TOKEN_KEY);

        window.location.replace("login.html");

    }


    function showNotification(message, error = false) {

        const notification =
            document.getElementById("notification");

        notification.textContent = message;

        notification.classList.toggle(
            "error",
            error
        );

        notification.classList.add("show");

        setTimeout(() => {

            notification.classList.remove("show");

        }, 3500);

    }


    /* =====================================================
       SESSION CHECK
    ===================================================== */

    async function checkAdminSession() {

        if (!adminToken) {

            window.location.replace("login.html");

            return false;

        }


        try {

            const response =
                await fetch(
                    `${API}/admin/check`,
                    {
                        headers: {
                            "Authorization":
                                `Bearer ${adminToken}`
                        }
                    }
                );


            if (response.status === 401) {

                handleUnauthorized();

                return false;

            }


            if (!response.ok) {

                showNotification(
                    "Unable to verify admin session.",
                    true
                );

                return false;

            }


            return true;

        }
        catch (error) {

            console.error(
                "Session check error:",
                error
            );

            showNotification(
                "Cannot connect to backend.",
                true
            );

            return false;

        }

    }


    /* =====================================================
       LOAD PRODUCTS
    ===================================================== */

    async function loadProducts() {

        const container =
            document.getElementById("products");


        container.innerHTML = `
            <div class="loading">
                Loading products...
            </div>
        `;


        try {

            const response =
                await fetch(
                    `${API}/products`
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load products"
                );

            }


            const products =
                await response.json();


            allProducts =
                Array.isArray(products)
                    ? products
                    : [];


            document.getElementById(
                "totalProducts"
            ).textContent =
                allProducts.length;


            document.getElementById(
                "availableProducts"
            ).textContent =
                allProducts.filter(
                    product =>
                        product.available === true
                ).length;


            filterProducts();

        }
        catch (error) {

            console.error(
                "Load products error:",
                error
            );


            container.innerHTML = `
                <div class="empty">

                    <h3>
                        Failed to load products
                    </h3>

                    <br>

                    <button
                        class="save-btn"
                        onclick="loadProducts()"
                    >
                        Retry
                    </button>

                </div>
            `;

        }

    }


    /* =====================================================
       SEARCH PRODUCTS
    ===================================================== */

    function filterProducts() {

        const search =
            document
                .getElementById("productSearch")
                .value
                .trim()
                .toLowerCase();


        const filtered =
            allProducts.filter(
                product =>
                    String(
                        product.name || ""
                    )
                    .toLowerCase()
                    .includes(search)
            );


        renderProducts(filtered);

    }


    /* =====================================================
       RENDER PRODUCTS
    ===================================================== */

    function renderProducts(products) {

        const container =
            document.getElementById("products");

        const search =
            document
                .getElementById("productSearch")
                .value
                .trim();


        const searchResult =
            document.getElementById("searchResult");


        if (search) {

            searchResult.textContent =
                `${products.length} product${
                    products.length === 1
                        ? ""
                        : "s"
                } found`;

        }
        else {

            searchResult.textContent = "";

        }


        if (products.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <h3>
                        No products found
                    </h3>

                    <p>
                        Try another search.
                    </p>

                </div>
            `;

            return;

        }


        container.innerHTML =
            products
                .map(product => {

                    const name =
                        escapeHtml(
                            product.name
                        );

                    const image =
                        escapeHtml(
                            product.image || ""
                        );

                    const price =
                        Number(
                            product.price || 0
                        );


                    const imageHtml =
                        image
                            ? `
                                <img
                                    src="${image}"
                                    class="product-image"
                                    alt="${name}"
                                    onerror="
                                        this.onerror=null;
                                        this.style.display='none';
                                    "
                                >
                            `
                            : `
                                <div class="no-image">
                                    No Image
                                </div>
                            `;


                    return `
                        <div class="product-card">

                            ${imageHtml}

                            <div class="product-info">

                                <h3>
                                    ${name}
                                </h3>

                                <div class="price">
                                    ₹${price.toFixed(2)}
                                </div>

                                <div class="${
                                    product.available
                                        ? "available"
                                        : "unavailable"
                                }">

                                    ${
                                        product.available
                                            ? "✓ Available"
                                            : "✕ Unavailable"
                                    }

                                </div>


                                <div class="product-actions">

                                    <button
                                        class="edit-btn"
                                        onclick="editProductById('${product._id}')"
                                    >
                                        Edit
                                    </button>

                                    <button
                                        class="delete-btn"
                                        onclick="deleteProduct('${product._id}')"
                                    >
                                        Delete
                                    </button>

                                </div>

                            </div>

                        </div>
                    `;

                })
                .join("");

    }


    /* =====================================================
       ADD PRODUCT
    ===================================================== */

    function showAddForm() {

        editingProductId = null;


        document.getElementById(
            "formTitle"
        ).textContent =
            "Add New Product";


        document.getElementById(
            "saveProductButton"
        ).textContent =
            "Save Product";


        document.getElementById(
            "productName"
        ).value = "";


        document.getElementById(
            "productPrice"
        ).value = "";


        document.getElementById(
            "productImage"
        ).value = "";


        document.getElementById(
            "productAvailable"
        ).checked = true;


        document.getElementById(
            "productForm"
        ).classList.add("active");


        document.getElementById(
            "productName"
        ).focus();

    }


    /* =====================================================
       EDIT PRODUCT
    ===================================================== */

    function editProductById(id) {

        const product =
            allProducts.find(
                item =>
                    item._id === id
            );


        if (!product) {

            showNotification(
                "Product not found.",
                true
            );

            return;

        }


        editingProductId = id;


        document.getElementById(
            "formTitle"
        ).textContent =
            "Edit Product";


        document.getElementById(
            "saveProductButton"
        ).textContent =
            "Update Product";


        document.getElementById(
            "productName"
        ).value =
            product.name || "";


        document.getElementById(
            "productPrice"
        ).value =
            product.price ?? "";


        document.getElementById(
            "productImage"
        ).value =
            product.image || "";


        document.getElementById(
            "productAvailable"
        ).checked =
            product.available !== false;


        document.getElementById(
            "productForm"
        ).classList.add("active");


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =====================================================
       SAVE PRODUCT
    ===================================================== */

    async function saveProduct() {

        const name =
            document
                .getElementById("productName")
                .value
                .trim();


        const price =
            document
                .getElementById("productPrice")
                .value;


        const image =
            document
                .getElementById("productImage")
                .value
                .trim();


        const available =
            document
                .getElementById("productAvailable")
                .checked;


        if (!name) {

            alert(
                "Please enter product name."
            );

            return;

        }


        if (
            price === "" ||
            Number(price) < 0
        ) {

            alert(
                "Please enter a valid price."
            );

            return;

        }


        const data = {

            name,

            price: Number(price),

            available,

            image

        };


        try {

            const url =
                editingProductId
                    ? `${API}/products/${editingProductId}`
                    : `${API}/products`;


            const method =
                editingProductId
                    ? "PUT"
                    : "POST";


            const response =
                await fetch(
                    url,
                    {
                        method,

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${adminToken}`

                        },

                        body:
                            JSON.stringify(data)

                    }
                );


            if (response.status === 401) {

                handleUnauthorized();

                return;

            }


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Failed to save product."
                );

            }


            showNotification(
                editingProductId
                    ? "Product updated successfully!"
                    : "Product added successfully!"
            );


            cancelForm();

            await loadProducts();

        }
        catch (error) {

            console.error(
                "Save product error:",
                error
            );


            showNotification(
                error.message ||
                "Cannot connect to backend.",
                true
            );

        }

    }


    /* =====================================================
       DELETE PRODUCT
    ===================================================== */

    async function deleteProduct(id) {

        const product =
            allProducts.find(
                item =>
                    item._id === id
            );


        if (!product) {

            return;

        }


        const confirmed =
            confirm(
                `Delete "${product.name}"?`
            );


        if (!confirmed) {

            return;

        }


        try {

            const response =
                await fetch(
                    `${API}/products/${id}`,
                    {
                        method: "DELETE",

                        headers: {
                            "Authorization":
                                `Bearer ${adminToken}`
                        }
                    }
                );


            if (response.status === 401) {

                handleUnauthorized();

                return;

            }


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Failed to delete product."
                );

            }


            showNotification(
                "Product deleted successfully!"
            );


            await loadProducts();

        }
        catch (error) {

            console.error(
                "Delete product error:",
                error
            );


            showNotification(
                error.message ||
                "Cannot connect to backend.",
                true
            );

        }

    }


    /* =====================================================
       CANCEL FORM
    ===================================================== */

    function cancelForm() {

        editingProductId = null;


        document.getElementById(
            "productForm"
        ).classList.remove("active");


        document.getElementById(
            "productName"
        ).value = "";


        document.getElementById(
            "productPrice"
        ).value = "";


        document.getElementById(
            "productImage"
        ).value = "";


        document.getElementById(
            "productAvailable"
        ).checked = true;


        document.getElementById(
            "saveProductButton"
        ).textContent =
            "Save Product";

    }


    /* =====================================================
       LOAD ORDER STATS
       IMPORTANT:
       This keeps the admin connected to orders.html
    ===================================================== */

    async function loadOrderStats() {

        try {

            const response =
                await fetch(
                    `${API}/orders`,
                    {
                        headers: {
                            "Authorization":
                                `Bearer ${adminToken}`
                        }
                    }
                );


            if (response.status === 401) {

                handleUnauthorized();

                return;

            }


            if (!response.ok) {

                return;

            }


            const orders =
                await response.json();


            const pending =
                orders.filter(
                    order =>
                        order.status === "Pending"
                ).length;


            document.getElementById(
                "pendingOrders"
            ).textContent =
                pending;


            const headerCount =
                document.getElementById(
                    "headerPendingCount"
                );


            if (pending > 0) {

                headerCount.textContent =
                    ` (${pending})`;

            }
            else {

                headerCount.textContent = "";

            }


            /* NEW ORDER NOTIFICATION */

            if (
                lastPendingCount > 0 &&
                pending > lastPendingCount
            ) {

                showNotification(
                    "🔔 New order received!"
                );

                playNotificationSound();

            }


            lastPendingCount = pending;

        }
        catch (error) {

            console.error(
                "Order stats error:",
                error
            );

        }

    }


    /* =====================================================
       NOTIFICATION SOUND
    ===================================================== */

    function playNotificationSound() {

        try {

            const audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();


            const oscillator =
                audioContext.createOscillator();


            const gain =
                audioContext.createGain();


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            oscillator.frequency.value =
                800;


            gain.gain.setValueAtTime(
                0.2,
                audioContext.currentTime
            );


            oscillator.start();


            oscillator.stop(
                audioContext.currentTime + 0.2
            );

        }
        catch (error) {

            console.log(
                "Notification sound unavailable."
            );

        }

    }


    /* =====================================================
       GO TO ORDERS
    ===================================================== */

    function goOrders() {

        window.location.href =
            "orders.html";

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    async function logout() {

        try {

            await fetch(
                `${API}/admin/logout`,
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            `Bearer ${adminToken}`
                    }
                }
            );

        }
        catch (error) {

            console.error(
                "Logout error:",
                error
            );

        }


        localStorage.removeItem(
            TOKEN_KEY
        );


        window.location.replace(
            "login.html"
        );

    }


    /* =====================================================
       SEARCH EVENT
    ===================================================== */

    document
        .getElementById("productSearch")
        .addEventListener(
            "input",
            filterProducts
        );


    /* =====================================================
       START DASHBOARD
    ===================================================== */

    async function startDashboard() {

        const authenticated =
            await checkAdminSession();


        if (!authenticated) {

            return;

        }


        await loadProducts();

        await loadOrderStats();


        /*
            Check orders every 5 seconds.
            This keeps Pending Orders updated.
        */

        setInterval(
            loadOrderStats,
            5000
        );

    }


    startDashboard();

</script>
