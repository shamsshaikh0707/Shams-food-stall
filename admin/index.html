<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shams Food Stall - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: none;
            cursor: pointer;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #111;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 24px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .orders-btn {
            background: #ff9800;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .orders-btn:hover {
            background: #f57c00;
        }

        .logout-btn {
            background: #e53935;
            color: white;
            padding: 11px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #c62828;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 6px;
        }

        .welcome p {
            color: #666;
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stat-card h3 {
            color: #777;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
        }

        /* =========================
           SECTION
        ========================= */

        .section {
            background: white;
            padding: 25px;
            border-radius: 10px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 22px;
        }

        .add-btn {
            background: #2e7d32;
            color: white;

            padding: 11px 18px;
            border-radius: 7px;

            font-weight: bold;
        }

        .add-btn:hover {
            background: #1b5e20;
        }

        /* =========================
           PRODUCT FORM
        ========================= */

        .product-form {
            display: none;

            background: #f7f7f7;
            padding: 20px;

            border-radius: 8px;
            margin-bottom: 25px;

            border: 1px solid #ddd;
        }

        .product-form.active {
            display: block;
        }

        .product-form h3 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 2fr;
            gap: 15px;
        }

        .form-group label {
            display: block;

            font-weight: bold;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="number"],
        input[type="url"] {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="url"]:focus {
            border-color: #1976d2;
        }

        .availability {
            margin: 18px 0;
        }

        .availability label {
            cursor: pointer;
            font-weight: bold;
        }

        .availability input {
            margin-right: 7px;
        }

        .save-btn {
            background: #1976d2;
            color: white;

            padding: 11px 18px;
            border-radius: 6px;

            font-weight: bold;
        }

        .save-btn:hover {
            background: #1565c0;
        }

        .cancel-btn {
            background: #777;
            color: white;

            padding: 11px 18px;
            border-radius: 6px;

            font-weight: bold;
            margin-left: 6px;
        }

        .cancel-btn:hover {
            background: #555;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product-card {
            background: white;

            border: 1px solid #ddd;
            border-radius: 10px;

            overflow: hidden;

            transition: transform 0.15s ease,
                        box-shadow 0.15s ease;
        }

        .product-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.10);
        }

        .product-image {
            width: 100%;
            height: 180px;

            object-fit: cover;

            display: block;

            background: #eee;
        }

        .no-image {
            height: 180px;

            background: #eee;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #888;
            font-weight: bold;
        }

        .product-info {
            padding: 15px;
        }

        .product-info h3 {
            margin-bottom: 8px;
            font-size: 19px;
        }

        .price {
            font-size: 19px;
            font-weight: bold;

            margin-bottom: 8px;
        }

        .available {
            color: #2e7d32;
            font-weight: bold;
        }

        .unavailable {
            color: #e53935;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 8px;

            margin-top: 15px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;

            padding: 10px;

            border-radius: 6px;

            color: white;
            font-weight: bold;
        }

        .edit-btn {
            background: #1976d2;
        }

        .edit-btn:hover {
            background: #1565c0;
        }

        .delete-btn {
            background: #e53935;
        }

        .delete-btn:hover {
            background: #c62828;
        }

        /* =========================
           EMPTY / LOADING
        ========================= */

        .empty {
            text-align: center;

            padding: 50px 20px;

            color: #777;

            grid-column: 1 / -1;
        }

        .empty h3 {
            margin-bottom: 8px;
            color: #555;
        }

        .loading {
            text-align: center;

            padding: 50px 20px;

            color: #777;

            grid-column: 1 / -1;
        }

        /* =========================
           NOTIFICATION
        ========================= */

        .notification {
            display: none;

            position: fixed;

            right: 20px;
            top: 20px;

            padding: 15px 20px;

            color: white;

            border-radius: 8px;

            z-index: 9999;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.2);

            font-weight: bold;

            max-width: 350px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 15px;

                text-align: center;
            }

            .header-buttons {
                width: 100%;
            }

            .header-buttons button {
                flex: 1;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .section {
                padding: 18px;
            }

            .section-header {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .add-btn {
                width: 100%;
            }

            .container {
                padding: 0 12px;
            }

            .product-form {
                padding: 15px;
            }

            .actions {
                flex-direction: column;
            }

            .cancel-btn {
                margin-left: 0;
                margin-top: 5px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>🍔 Shams Food Stall</h1>

    <div class="header-buttons">

        <button
            class="orders-btn"
            onclick="goOrders()"
        >
            📦 Orders
        </button>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<div class="container">

    <div class="welcome">

        <h2>Admin Dashboard</h2>

        <p>
            Manage your food stall products and orders.
        </p>

    </div>


    <!-- =========================
         STATS
    ========================== -->

    <div class="stats">

        <div class="stat-card">

            <h3>Total Products</h3>

            <p id="totalProducts">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>Available Products</h3>

            <p id="availableProducts">
                0
            </p>

        </div>


        <div class="stat-card">

            <h3>Pending Orders</h3>

            <p id="pendingOrders">
                0
            </p>

        </div>

    </div>


    <!-- =========================
         PRODUCTS SECTION
    ========================== -->

    <div class="section">

        <div class="section-header">

            <h2>
                🍽️ Products
            </h2>

            <button
                class="add-btn"
                onclick="showAddForm()"
            >
                + Add Product
            </button>

        </div>


        <!-- PRODUCT FORM -->

        <div
            id="productForm"
            class="product-form"
        >

            <h3 id="formTitle">
                Add Product
            </h3>


            <div class="form-grid">

                <div class="form-group">

                    <label for="productName">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Chicken Biryani"
                        autocomplete="off"
                    >

                </div>


                <div class="form-group">

                    <label for="productPrice">
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        min="0"
                        step="0.01"
                        placeholder="150"
                    >

                </div>


                <div class="form-group">

                    <label for="productImage">
                        Image URL
                    </label>

                    <input
                        type="url"
                        id="productImage"
                        placeholder="https://example.com/image.jpg"
                        autocomplete="off"
                    >

                </div>

            </div>


            <div class="availability">

                <label>

                    <input
                        type="checkbox"
                        id="productAvailable"
                        checked
                    >

                    Product Available

                </label>

            </div>


            <button
                class="save-btn"
                id="saveProductButton"
                onclick="saveProduct()"
            >
                Save Product
            </button>


            <button
                class="cancel-btn"
                onclick="cancelForm()"
            >
                Cancel
            </button>

        </div>


        <!-- PRODUCTS -->

        <div
            id="products"
            class="products"
        >

            <div class="loading">
                Loading products...
            </div>

        </div>

    </div>

</div>


<!-- =========================
     NOTIFICATION
========================== -->

<div
    id="notification"
    class="notification"
></div>


<script>

const API = "/api";

const TOKEN_KEY = "adminToken";

let adminToken =
    localStorage.getItem(TOKEN_KEY);

let editingProductId = null;


// ========================================
// START
// ========================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        checkAdminSession();

    }
);


// ========================================
// CHECK ADMIN SESSION
// ========================================

async function checkAdminSession() {

    adminToken =
        localStorage.getItem(TOKEN_KEY);


    if (!adminToken) {

        window.location.replace(
            "login.html"
        );

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/admin/check`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${adminToken}`
                    }
                }
            );


        if (response.status === 401) {

            localStorage.removeItem(
                TOKEN_KEY
            );

            window.location.replace(
                "login.html"
            );

            return;

        }


        if (!response.ok) {

            showNotification(
                "Unable to verify admin session.",
                true
            );

            return;

        }


        await loadProducts();

        await loadOrderStats();

    }
    catch (error) {

        console.error(
            "Session check error:",
            error
        );

        showNotification(
            "Cannot connect to backend.",
            true
        );

    }

}


// ========================================
// LOAD PRODUCTS
// ========================================

async function loadProducts() {

    const container =
        document.getElementById(
            "products"
        );


    container.innerHTML = `
        <div class="loading">
            Loading products...
        </div>
    `;


    try {

        const response =
            await fetch(
                `${API}/products`
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        if (!response.ok) {

            throw new Error(
                "Failed to load products"
            );

        }


        const products =
            await response.json();


        if (!Array.isArray(products)) {

            throw new Error(
                "Invalid products response"
            );

        }


        renderProducts(products);


        document.getElementById(
            "totalProducts"
        ).textContent =
            products.length;


        document.getElementById(
            "availableProducts"
        ).textContent =
            products.filter(
                product =>
                    product.available === true
            ).length;

    }
    catch (error) {

        console.error(
            "Load products error:",
            error
        );


        container.innerHTML = `
            <div class="empty">

                <h3>
                    Failed to load products
                </h3>

                <p>
                    Please make sure the backend is running.
                </p>

                <br>

                <button
                    class="save-btn"
                    onclick="loadProducts()"
                >
                    Retry
                </button>

            </div>
        `;

    }

}


// ========================================
// RENDER PRODUCTS
// ========================================

function renderProducts(products) {

    const container =
        document.getElementById(
            "products"
        );


    if (products.length === 0) {

        container.innerHTML = `
            <div class="empty">

                <h3>
                    No products yet.
                </h3>

                <p>
                    Click "+ Add Product" to add your first food item.
                </p>

            </div>
        `;

        return;

    }


    container.innerHTML =
        products.map(
            product => {

                const safeName =
                    escapeHtml(
                        product.name || ""
                    );


                const safeImage =
                    escapeHtml(
                        product.image || ""
                    );


                const price =
                    Number(
                        product.price || 0
                    );


                let imageHTML = "";


                if (safeImage) {

                    imageHTML = `
                        <img
                            src="${safeImage}"
                            class="product-image"
                            alt="${safeName}"
                            onerror="this.onerror=null; this.parentElement.innerHTML='<div class=&quot;no-image&quot;>Image unavailable</div>'"
                        >
                    `;

                }
                else {

                    imageHTML = `
                        <div class="no-image">
                            No Image
                        </div>
                    `;

                }


                return `
                    <div class="product-card">

                        ${imageHTML}

                        <div class="product-info">

                            <h3>
                                ${safeName}
                            </h3>


                            <div class="price">
                                ₹${price.toFixed(2)}
                            </div>


                            <div class="${
                                product.available
                                    ? "available"
                                    : "unavailable"
                            }">

                                ${
                                    product.available
                                        ? "✓ Available"
                                        : "✕ Unavailable"
                                }

                            </div>


                            <div class="actions">

                                <button
                                    class="edit-btn"
                                    onclick="editProductById('${product._id}')"
                                >
                                    ✏️ Edit
                                </button>


                                <button
                                    class="delete-btn"
                                    onclick="deleteProduct('${product._id}')"
                                >
                                    🗑️ Delete
                                </button>

                            </div>

                        </div>

                    </div>
                `;

            }
        ).join("");

}


// ========================================
// EDIT PRODUCT
// ========================================

async function editProductById(id) {

    try {

        const response =
            await fetch(
                `${API}/products`
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load product"
            );

        }


        const products =
            await response.json();


        const product =
            products.find(
                item =>
                    String(item._id) ===
                    String(id)
            );


        if (!product) {

            alert(
                "Product not found."
            );

            return;

        }


        editProduct(product);

    }
    catch (error) {

        console.error(
            "Edit product error:",
            error
        );

        alert(
            "Could not load product."
        );

    }

}


// ========================================
// SHOW ADD FORM
// ========================================

function showAddForm() {

    editingProductId = null;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Add Product";


    document.getElementById(
        "productName"
    ).value = "";


    document.getElementById(
        "productPrice"
    ).value = "";


    document.getElementById(
        "productImage"
    ).value = "";


    document.getElementById(
        "productAvailable"
    ).checked = true;


    document.getElementById(
        "saveProductButton"
    ).textContent =
        "Save Product";


    document.getElementById(
        "productForm"
    ).classList.add(
        "active"
    );


    document.getElementById(
        "productName"
    ).focus();

}


// ========================================
// EDIT FORM
// ========================================

function editProduct(product) {

    editingProductId =
        product._id;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Product";


    document.getElementById(
        "productName"
    ).value =
        product.name || "";


    document.getElementById(
        "productPrice"
    ).value =
        product.price ?? "";


    document.getElementById(
        "productImage"
    ).value =
        product.image || "";


    document.getElementById(
        "productAvailable"
    ).checked =
        product.available !== false;


    document.getElementById(
        "saveProductButton"
    ).textContent =
        "Update Product";


    document.getElementById(
        "productForm"
    ).classList.add(
        "active"
    );


    document.getElementById(
        "productName"
    ).focus();

}


// ========================================
// SAVE / UPDATE PRODUCT
// ========================================

async function saveProduct() {

    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const priceValue =
        document.getElementById(
            "productPrice"
        ).value;


    const image =
        document.getElementById(
            "productImage"
        ).value.trim();


    const available =
        document.getElementById(
            "productAvailable"
        ).checked;


    if (!name) {

        alert(
            "Enter product name."
        );

        return;

    }


    if (
        priceValue === "" ||
        Number.isNaN(
            Number(priceValue)
        ) ||
        Number(priceValue) < 0
    ) {

        alert(
            "Enter a valid price."
        );

        return;

    }


    const price =
        Number(priceValue);


    const data = {

        name,
        price,
        image,
        available

    };


    const button =
        document.getElementById(
            "saveProductButton"
        );


    button.disabled = true;

    button.textContent =
        editingProductId
            ? "Updating..."
            : "Saving...";


    try {

        const url =
            editingProductId
                ? `${API}/products/${editingProductId}`
                : `${API}/products`;


        const method =
            editingProductId
                ? "PUT"
                : "POST";


        const response =
            await fetch(
                url,
                {
                    method,

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${adminToken}`

                    },

                    body:
                        JSON.stringify(data)

                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Failed to save product."
            );

        }


        showNotification(
            editingProductId
                ? "Product updated successfully!"
                : "Product added successfully!"
        );


        cancelForm();


        await loadProducts();

    }
    catch (error) {

        console.error(
            "Save product error:",
            error
        );


        alert(
            error.message ||
            "Cannot connect to backend."
        );

    }
    finally {

        button.disabled = false;

        button.textContent =
            editingProductId
                ? "Update Product"
                : "Save Product";

    }

}


// ========================================
// DELETE PRODUCT
// ========================================

async function deleteProduct(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API}/products/${id}`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            `Bearer ${adminToken}`
                    }
                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Failed to delete product."
            );

        }


        showNotification(
            "Product deleted successfully!"
        );


        await loadProducts();

    }
    catch (error) {

        console.error(
            "Delete product error:",
            error
        );


        alert(
            error.message ||
            "Cannot connect to backend."
        );

    }

}


// ========================================
// CANCEL FORM
// ========================================

function cancelForm() {

    editingProductId = null;


    document.getElementById(
        "productForm"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "productName"
    ).value = "";


    document.getElementById(
        "productPrice"
    ).value = "";


    document.getElementById(
        "productImage"
    ).value = "";


    document.getElementById(
        "productAvailable"
    ).checked = true;


    document.getElementById(
        "saveProductButton"
    ).textContent =
        "Save Product";

}


// ========================================
// LOAD ORDER STATS
// ========================================

async function loadOrderStats() {

    try {

        const response =
            await fetch(
                `${API}/orders`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${adminToken}`
                    }
                }
            );


        if (response.status === 401) {

            handleUnauthorized();

            return;

        }


        if (!response.ok) {

            return;

        }


        const orders =
            await response.json();


        const pending =
            orders.filter(
                order =>
                    order.status === "Pending"
            ).length;


        document.getElementById(
            "pendingOrders"
        ).textContent =
            pending;

    }
    catch (error) {

        console.error(
            "Order stats error:",
            error
        );

    }

}


// ========================================
// GO TO ORDERS
// ========================================

function goOrders() {

    window.location.href =
        "orders.html";

}


// ========================================
// LOGOUT
// ========================================

async function logout() {

    try {

        await fetch(
            `${API}/admin/logout`,
            {
                method: "POST",

                headers: {
                    "Authorization":
                        `Bearer ${adminToken}`
                }
            }
        );

    }
    catch (error) {

        console.error(
            "Logout error:",
            error
        );

    }


    localStorage.removeItem(
        TOKEN_KEY
    );


    window.location.replace(
        "login.html"
    );

}


// ========================================
// HANDLE UNAUTHORIZED
// ========================================

function handleUnauthorized() {

    localStorage.removeItem(
        TOKEN_KEY
    );


    adminToken = null;


    window.location.replace(
        "login.html"
    );

}


// ========================================
// NOTIFICATION
// ========================================

function showNotification(
    message,
    error = false
) {

    const box =
        document.getElementById(
            "notification"
        );


    box.textContent =
        message;


    box.style.background =
        error
            ? "#e53935"
            : "#2e7d32";


    box.style.display =
        "block";


    setTimeout(
        function () {

            box.style.display =
                "none";

        },
        3000
    );

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(value) {

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


// ========================================
// REFRESH ORDER COUNT
// ========================================

setInterval(
    function () {

        if (
            localStorage.getItem(
                TOKEN_KEY
            )
        ) {

            loadOrderStats();

        }

    },
    5000
);

</script>
