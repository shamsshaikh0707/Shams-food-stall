<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shams Restaurant - Admin</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        body {
            background: #f5f7fb;
        }


        .navbar-brand {
            font-weight: 700;
        }


        .dashboard-title {
            font-weight: 700;
        }


        .product-card {
            border: none;
            border-radius: 14px;
            overflow: hidden;
            transition: 0.2s;
        }


        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.10) !important;
        }


        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #e9ecef;
        }


        .no-image {
            width: 100%;
            height: 220px;
            background: #e9ecef;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #6c757d;
            font-size: 18px;
        }


        .price {
            font-size: 22px;
            font-weight: 700;
            color: #0d6efd;
        }


        .status-badge {
            font-size: 13px;
        }


        .modal-content {
            border: none;
            border-radius: 15px;
        }


        .modal-header {
            background: #212529;
            color: white;
        }


        .form-control,
        .form-check-input {
            cursor: pointer;
        }


        #image-preview {
            display: none;
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
        }


        .loading {
            padding: 60px;
            text-align: center;
        }


        /* SEARCH BOX */

        .search-box {
            max-width: 500px;
            width: 100%;
        }


        .search-box .input-group-text {
            background: white;
            border-right: 0;
        }


        .search-box input {
            border-left: 0;
            box-shadow: none !important;
        }


        .search-box input:focus {
            border-color: #dee2e6;
        }


        .search-result-text {
            color: #6c757d;
            font-size: 14px;
        }


        @media (max-width: 768px) {

            .top-header {
                flex-direction: column;
                align-items: stretch !important;
                gap: 15px;
            }

            .search-box {
                max-width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- ========================================= -->
<!-- NAVBAR -->
<!-- ========================================= -->

<nav class="navbar navbar-dark bg-dark shadow-sm">

    <div class="container">

        <span class="navbar-brand">
            🍔 Shams Restaurant
        </span>


        <span class="text-white">
            Admin Dashboard
        </span>

    </div>

</nav>



<!-- ========================================= -->
<!-- MAIN -->
<!-- ========================================= -->

<main class="container py-5">


    <!-- HEADER -->

    <div
        class="d-flex justify-content-between align-items-center mb-4 top-header"
    >

        <div>

            <h1 class="dashboard-title">
                Products
            </h1>

            <p class="text-muted mb-0">
                Manage your restaurant menu
            </p>

        </div>


        <button
            class="btn btn-primary"
            onclick="openAddModal()"
        >

            + Add Product

        </button>

    </div>



    <!-- ========================================= -->
    <!-- SEARCH -->
    <!-- ========================================= -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <div class="search-box">

                <label
                    for="product-search"
                    class="form-label fw-semibold"
                >
                    🔍 Search Products
                </label>


                <div class="input-group">

                    <span class="input-group-text">
                        🔍
                    </span>

                    <input
                        type="text"
                        id="product-search"
                        class="form-control"
                        placeholder="Search by product name..."
                        autocomplete="off"
                    >

                </div>


                <div
                    id="search-result-text"
                    class="search-result-text mt-2"
                ></div>

            </div>

        </div>

    </div>



    <!-- ========================================= -->
    <!-- PRODUCTS -->
    <!-- ========================================= -->

    <div
        id="products-container"
        class="row g-4"
    >

        <div class="loading">

            <div
                class="spinner-border text-primary"
                role="status"
            ></div>

            <p class="mt-3">
                Loading products...
            </p>

        </div>

    </div>


</main>



<!-- ========================================= -->
<!-- ADD / EDIT MODAL -->
<!-- ========================================= -->

<div
    class="modal fade"
    id="productModal"
    tabindex="-1"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <!-- HEADER -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle"
                >
                    Add New Product
                </h5>


                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                ></button>

            </div>



            <!-- BODY -->

            <div class="modal-body">


                <!-- Product ID -->

                <input
                    type="hidden"
                    id="product-id"
                >


                <!-- NAME -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold"
                    >
                        Product Name
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="product-name"
                        placeholder="Example: Chicken Burger"
                        required
                    >

                </div>



                <!-- PRICE -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold"
                    >
                        Price
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            ₹
                        </span>

                        <input
                            type="number"
                            class="form-control"
                            id="product-price"
                            placeholder="120"
                            min="0"
                            required
                        >

                    </div>

                </div>



                <!-- IMAGE -->

                <div class="mb-3">

                    <label
                        class="form-label fw-semibold"
                    >
                        Image URL
                    </label>

                    <input
                        type="url"
                        class="form-control"
                        id="product-image"
                        placeholder="https://example.com/image.jpg"
                        oninput="previewImage()"
                    >


                    <img
                        id="image-preview"
                        alt="Image Preview"
                    >

                </div>



                <!-- AVAILABLE -->

                <div class="form-check mb-3">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="product-available"
                        checked
                    >

                    <label
                        class="form-check-label"
                        for="product-available"
                    >

                        Product Available

                    </label>

                </div>


            </div>



            <!-- FOOTER -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn btn-success"
                    onclick="saveProduct()"
                >

                    Save Product

                </button>

            </div>


        </div>

    </div>

</div>



<!-- ========================================= -->
<!-- BOOTSTRAP JS -->
<!-- ========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>



<script>


// =========================================
// API
// =========================================

const API_URL = "/api/products";


// =========================================
// ADMIN TOKEN
// =========================================

const TOKEN_KEY = "adminToken";


function getToken() {

    return localStorage.getItem(TOKEN_KEY);

}


function getAuthHeaders() {

    const token = getToken();

    return {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
    };

}


// =========================================
// GLOBAL VARIABLES
// =========================================

let productModal;

let allProducts = [];



// =========================================
// CHECK ADMIN LOGIN
// =========================================

async function checkAdminLogin() {

    const token = getToken();

    if (!token) {

        window.location.href = "login.html";

        return false;

    }


    try {

        const response = await fetch(
            "/api/admin/check",
            {
                headers: {
                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );


        if (!response.ok) {

            localStorage.removeItem(TOKEN_KEY);

            window.location.href =
                "login.html";

            return false;

        }


        return true;


    } catch (error) {

        console.error(error);

        return false;

    }

}



// =========================================
// LOAD PRODUCTS
// =========================================

async function loadProducts() {

    const container =
        document.getElementById(
            "products-container"
        );


    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Failed to load products"
            );

        }


        allProducts =
            await response.json();


        renderProducts(
            allProducts
        );


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="col-12">

                <div class="alert alert-danger">

                    ❌ Could not load products.

                    <br>

                    Please refresh the page.

                </div>

            </div>

        `;

    }

}



// =========================================
// RENDER PRODUCTS
// =========================================

function renderProducts(products) {

    const container =
        document.getElementById(
            "products-container"
        );


    const resultText =
        document.getElementById(
            "search-result-text"
        );


    container.innerHTML = "";


    // NO PRODUCTS AT ALL

    if (allProducts.length === 0) {

        resultText.textContent = "";

        container.innerHTML = `

            <div class="col-12">

                <div class="alert alert-info text-center">

                    No products found.

                    <br>

                    Click
                    <strong>+ Add Product</strong>
                    to create your first product.

                </div>

            </div>

        `;

        return;

    }


    // SEARCH RESULT COUNT

    const searchInput =
        document.getElementById(
            "product-search"
        ).value.trim();


    if (searchInput) {

        resultText.textContent =
            `${products.length} product${
                products.length === 1
                    ? ""
                    : "s"
            } found`;

    } else {

        resultText.textContent =
            `${products.length} product${
                products.length === 1
                    ? ""
                    : "s"
            }`;

    }


    // NO SEARCH MATCH

    if (products.length === 0) {

        container.innerHTML = `

            <div class="col-12">

                <div class="alert alert-warning text-center">

                    🔍 No products match

                    <strong>
                        "${escapeHTML(searchInput)}"
                    </strong>

                </div>

            </div>

        `;

        return;

    }


    // CREATE PRODUCT CARDS

    products.forEach(function(product) {

        const productDiv =
            document.createElement(
                "div"
            );


        productDiv.className =
            "col-md-6 col-lg-4";


        const imageHTML =
            product.image

                ? `

                    <img
                        src="${escapeAttribute(product.image)}"
                        class="product-image"
                        alt="${escapeAttribute(product.name)}"
                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='flex';
                        "
                    >

                    <div
                        class="no-image"
                        style="display:none;"
                    >

                        🍔 Image unavailable

                    </div>

                `

                : `

                    <div class="no-image">

                        🍔 No Image

                    </div>

                `;


        productDiv.innerHTML = `

            <div class="card product-card shadow-sm h-100">


                ${imageHTML}



                <div class="card-body">


                    <h4 class="card-title fw-bold">

                        ${escapeHTML(product.name)}

                    </h4>



                    <div class="price mb-3">

                        ₹${Number(product.price).toFixed(2)}

                    </div>



                    <div class="mb-3">

                        <span class="text-muted">
                            Status:
                        </span>


                        <span
                            class="badge status-badge ${
                                product.available
                                    ? "bg-success"
                                    : "bg-danger"
                            }"
                        >

                            ${
                                product.available
                                    ? "Available"
                                    : "Out of Stock"
                            }

                        </span>

                    </div>



                    <div class="d-flex gap-2">


                        <button
                            class="btn btn-warning btn-sm"
                            onclick='editProduct(${JSON.stringify(product)})'
                        >

                            ✏️ Edit

                        </button>



                        <button
                            class="btn btn-danger btn-sm"
                            onclick="deleteProduct('${product._id}')"
                        >

                            🗑️ Delete

                        </button>


                    </div>


                </div>

            </div>

        `;


        container.appendChild(
            productDiv
        );

    });

}



// =========================================
// SEARCH
// =========================================

function searchProducts() {

    const searchInput =
        document.getElementById(
            "product-search"
        );


    const searchTerm =
        searchInput.value
            .trim()
            .toLowerCase();


    const filteredProducts =
        allProducts.filter(
            function(product) {

                return product.name
                    .toLowerCase()
                    .includes(searchTerm);

            }
        );


    renderProducts(
        filteredProducts
    );

}



// =========================================
// OPEN ADD MODAL
// =========================================

function openAddModal() {


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add New Product";


    document.getElementById(
        "product-id"
    ).value = "";


    document.getElementById(
        "product-name"
    ).value = "";


    document.getElementById(
        "product-price"
    ).value = "";


    document.getElementById(
        "product-image"
    ).value = "";


    document.getElementById(
        "product-available"
    ).checked = true;


    document.getElementById(
        "image-preview"
    ).style.display = "none";


    productModal.show();

}



// =========================================
// EDIT PRODUCT
// =========================================

function editProduct(product) {


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Product";


    document.getElementById(
        "product-id"
    ).value =
        product._id;


    document.getElementById(
        "product-name"
    ).value =
        product.name;


    document.getElementById(
        "product-price"
    ).value =
        product.price;


    document.getElementById(
        "product-image"
    ).value =
        product.image || "";


    document.getElementById(
        "product-available"
    ).checked =
        product.available;


    previewImage();


    productModal.show();

}



// =========================================
// SAVE PRODUCT
// =========================================

async function saveProduct() {


    const id =
        document.getElementById(
            "product-id"
        ).value;


    const name =
        document.getElementById(
            "product-name"
        ).value.trim();


    const price =
        document.getElementById(
            "product-price"
        ).value;


    const image =
        document.getElementById(
            "product-image"
        ).value.trim();


    const available =
        document.getElementById(
            "product-available"
        ).checked;



    // VALIDATION

    if (!name) {

        alert(
            "Please enter a product name."
        );

        return;

    }


    if (
        price === "" ||
        Number(price) < 0
    ) {

        alert(
            "Please enter a valid price."
        );

        return;

    }



    const productData = {

        name: name,

        price: Number(price),

        image: image,

        available: available

    };



    try {


        let response;


        // EDIT

        if (id) {

            response =
                await fetch(
                    `${API_URL}/${id}`,
                    {
                        method: "PUT",

                        headers:
                            getAuthHeaders(),

                        body:
                            JSON.stringify(
                                productData
                            )
                    }
                );

        }


        // ADD

        else {

            response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers:
                            getAuthHeaders(),

                        body:
                            JSON.stringify(
                                productData
                            )
                    }
                );

        }



        const result =
            await response.json();



        if (
            response.status === 401
        ) {

            localStorage.removeItem(
                TOKEN_KEY
            );

            window.location.href =
                "login.html";

            return;

        }



        if (!response.ok) {

            throw new Error(
                result.message ||
                "Something went wrong"
            );

        }



        // CLOSE MODAL

        productModal.hide();



        // RELOAD PRODUCTS

        await loadProducts();



        // SUCCESS MESSAGE

        alert(
            id
                ? "Product updated successfully! ✅"
                : "Product added successfully! ✅"
        );


    } catch (error) {

        console.error(error);


        alert(
            "Error: " +
            error.message
        );

    }

}



// =========================================
// DELETE PRODUCT
// =========================================

async function deleteProduct(id) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmed) {

        return;

    }



    try {


        const response =
            await fetch(
                `${API_URL}/${id}`,
                {
                    method: "DELETE",

                    headers:
                        getAuthHeaders()
                }
            );


        const result =
            await response.json();



        if (
            response.status === 401
        ) {

            localStorage.removeItem(
                TOKEN_KEY
            );

            window.location.href =
                "login.html";

            return;

        }



        if (!response.ok) {

            throw new Error(
                result.message ||
                "Failed to delete product"
            );

        }



        alert(
            "Product deleted successfully! 🗑️"
        );


        await loadProducts();


    } catch (error) {

        console.error(error);


        alert(
            "Error: " +
            error.message
        );

    }

}



// =========================================
// IMAGE PREVIEW
// =========================================

function previewImage() {


    const input =
        document.getElementById(
            "product-image"
        );


    const preview =
        document.getElementById(
            "image-preview"
        );


    const url =
        input.value.trim();


    if (!url) {

        preview.style.display =
            "none";

        return;

    }


    preview.src = url;

    preview.style.display =
        "block";


    preview.onerror =
        function() {

            preview.style.display =
                "none";

        };

}



// =========================================
// ESCAPE HTML
// =========================================

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}



// =========================================
// ESCAPE ATTRIBUTE
// =========================================

function escapeAttribute(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}



// =========================================
// START
// =========================================

document.addEventListener(
    "DOMContentLoaded",
    async function() {


        productModal =
            new bootstrap.Modal(
                document.getElementById(
                    "productModal"
                )
            );



        // SEARCH EVENT

        document
            .getElementById(
                "product-search"
            )
            .addEventListener(
                "input",
                searchProducts
            );



        // CHECK LOGIN

        const loggedIn =
            await checkAdminLogin();


        if (!loggedIn) {

            return;

        }



        // LOAD PRODUCTS

        loadProducts();

    }
);

</script>


</body>

</html>
