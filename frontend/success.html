<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful - Shams Food Stall</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-card {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 16px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #198754;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
            color: #198754;
        }

        .message {
            margin: 0 auto 25px;
            color: #555;
            font-size: 17px;
            line-height: 1.6;
        }

        .order-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .order-box p {
            margin: 8px 0;
        }

        .order-id {
            word-break: break-all;
            font-size: 14px;
            color: #555;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            color: #0d6efd;
        }

        .status {
            display: inline-block;
            margin-top: 8px;
            padding: 7px 12px;
            border-radius: 20px;
            background: #fff3cd;
            color: #664d03;
            font-weight: bold;
        }

        .home-button {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 25px;
            border-radius: 8px;
            background: #198754;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .home-button:hover {
            opacity: 0.9;
        }

        .empty-message {
            color: #777;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .success-card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>Order Placed Successfully!</h1>

        <p class="message">
            Thank you for ordering from
            <strong>Shams Food Stall</strong>.
            <br>
            Your order has been received and is now being processed.
        </p>

        <div id="orderDetails">
            <!-- Order details will appear here -->
        </div>

        <a href="index.html" class="home-button">
            ← Back to Menu
        </a>

    </div>

    <script>
        const ORDER_KEY = "shamsLastOrder";

        function formatMoney(amount) {
            return "₹" + Number(amount || 0).toFixed(2);
        }

        function loadOrder() {
            const container = document.getElementById("orderDetails");

            let order = null;

            try {
                order = JSON.parse(
                    localStorage.getItem(ORDER_KEY)
                );
            } catch (error) {
                order = null;
            }

            if (!order) {
                container.innerHTML = `
                    <div class="order-box">
                        <p class="empty-message">
                            Your order was successfully submitted.
                            Order details are not available on this page.
                        </p>
                    </div>
                `;

                return;
            }

            const orderId =
                order._id ||
                order.id ||
                "Received";

            const total =
                order.total ||
                0;

            const status =
                order.status ||
                "Pending";

            const itemCount =
                Array.isArray(order.items)
                    ? order.items.reduce(
                        (sum, item) =>
                            sum + (Number(item.quantity) || 0),
                        0
                    )
                    : 0;

            container.innerHTML = `
                <div class="order-box">

                    <p>
                        <strong>Order ID:</strong>
                    </p>

                    <p class="order-id">
                        ${escapeHtml(String(orderId))}
                    </p>

                    <p>
                        <strong>Items:</strong>
                        ${itemCount}
                    </p>

                    <p>
                        <strong>Total:</strong>
                    </p>

                    <p class="total">
                        ${formatMoney(total)}
                    </p>

                    <p>
                        <strong>Status:</strong>
                    </p>

                    <span class="status">
                        ${escapeHtml(String(status))}
                    </span>

                </div>
            `;
        }

        function escapeHtml(value) {
            return value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        loadOrder();
    </script>

</body>
</html>
