<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful - Shams Food Stall</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --text: #1d1f2b;
            --muted: #6b7280;
            --border: #e5e7eb;

            --dark: #14151f;
            --orange: #ff7a1a;
            --orange-dark: #e56608;
            --green: #16a34a;
            --green-dark: #15803d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", Arial, sans-serif;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at 12% 20%, rgba(22, 163, 74, 0.28), transparent 45%),
                radial-gradient(circle at 88% 80%, rgba(255, 122, 26, 0.3), transparent 45%),
                linear-gradient(135deg, #14151f, #272a3d);
        }

        /* ================= CARD ================= */

        .success-card {
            width: 100%;
            max-width: 560px;
            background: white;
            border-radius: 26px;
            padding: 42px 30px 34px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            animation: card-in 0.5s ease;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= ICON ================= */

        .success-icon {
            width: 92px;
            height: 92px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            box-shadow: 0 10px 28px rgba(22, 163, 74, 0.45);
            animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
        }

        @keyframes pop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .message {
            margin: 0 auto 26px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        .message strong {
            color: var(--text);
        }

        /* ================= ORDER BOX ================= */

        .order-box {
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px 22px;
            margin: 0 0 24px;
            text-align: left;
        }

        .order-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding-bottom: 14px;
            border-bottom: 1px dashed #d1d5db;
            margin-bottom: 14px;
        }

        .order-number-label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }

        .order-number {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            background: #ffedd5;
            color: #c2410c;
            font-weight: 600;
            font-size: 13px;
        }

        .items-list {
            list-style: none;
            margin-bottom: 14px;
        }

        .items-list li {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 7px 0;
            font-size: 14px;
        }

        .items-list .item-name {
            color: var(--text);
            font-weight: 500;
        }

        .items-list .item-qty {
            color: var(--orange-dark);
            font-weight: 700;
            margin-right: 6px;
        }

        .items-list .item-total {
            color: var(--muted);
            white-space: nowrap;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-radius: 14px;
            background: #fff7f0;
            font-size: 18px;
            font-weight: 700;
        }

        .total-row span:last-child {
            color: var(--orange);
            font-size: 22px;
        }

        .full-id {
            margin-top: 12px;
            font-size: 11px;
            color: #9ca3af;
            word-break: break-all;
        }

        .empty-message {
            color: var(--muted);
            line-height: 1.7;
            font-size: 14px;
            text-align: center;
        }

        /* ================= BUTTON ================= */

        .home-button {
            display: inline-block;
            padding: 14px 30px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(255, 122, 26, 0.35);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .home-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 26px rgba(255, 122, 26, 0.5);
        }

        .home-button:active {
            transform: scale(0.97);
        }

        .footer-note {
            margin-top: 18px;
            font-size: 12px;
            color: #9ca3af;
        }

        @media (max-width: 520px) {
            .success-card {
                padding: 32px 18px 28px;
            }

            h1 {
                font-size: 24px;
            }

            .order-box {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>Order Placed Successfully!</h1>

        <p class="message">
            Thank you for ordering from
            <strong>Shams Food Stall</strong>.
            <br>
            Your order has been received and is now being processed.
        </p>

        <div id="orderDetails">
            <!-- Order details will appear here -->
        </div>

        <a href="index.html" class="home-button">
            ← Back to Menu
        </a>

        <p class="footer-note">
            🍔 Fresh food, made with love.
        </p>

    </div>

    <script>
        const ORDER_KEY = "shamsLastOrder";

        function formatMoney(amount) {
            return "₹" + Number(amount || 0).toFixed(2);
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function loadOrder() {
            const container = document.getElementById("orderDetails");

            let order = null;

            try {
                order = JSON.parse(
                    localStorage.getItem(ORDER_KEY)
                );
            } catch (error) {
                order = null;
            }

            if (!order) {
                container.innerHTML = `
                    <div class="order-box">
                        <p class="empty-message">
                            Your order was successfully submitted.
                            Order details are not available on this page.
                        </p>
                    </div>
                `;

                return;
            }

            const orderId = String(
                order._id ||
                order.id ||
                "Received"
            );

            /* Same short number the restaurant sees in the admin panel */

            const shortId =
                orderId === "Received"
                    ? "Received"
                    : orderId.slice(-6).toUpperCase();

            const total =
                order.total ||
                0;

            const status =
                order.status ||
                "Pending";

            const items =
                Array.isArray(order.items)
                    ? order.items
                    : [];

            const itemsHtml = items.map((item) => {
                const quantity = Number(item.quantity) || 0;
                const price = Number(item.price) || 0;

                return `
                    <li>
                        <span class="item-name">
                            <span class="item-qty">${quantity}×</span>
                            ${escapeHtml(item.name || "Item")}
                        </span>

                        <span class="item-total">
                            ${formatMoney(price * quantity)}
                        </span>
                    </li>
                `;
            }).join("");

            container.innerHTML = `
                <div class="order-box">

                    <div class="order-head">

                        <div>
                            <div class="order-number-label">
                                Order number
                            </div>

                            <div class="order-number">
                                #${escapeHtml(shortId)}
                            </div>
                        </div>

                        <span class="status">
                            ${escapeHtml(String(status))}
                        </span>

                    </div>

                    ${
                        itemsHtml
                            ? `<ul class="items-list">${itemsHtml}</ul>`
                            : ""
                    }

                    <div class="total-row">
                        <span>Total</span>
                        <span>${formatMoney(total)}</span>
                    </div>

                    <p class="full-id">
                        Order ID: ${escapeHtml(orderId)}
                    </p>

                </div>
            `;
        }

        loadOrder();
    </script>

</body>
</html>
