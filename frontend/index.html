<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shams Restaurant</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        body {
            background: #f8f9fa;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            background: #212529;
        }


        .navbar-brand {
            font-weight: 700;
            font-size: 22px;
        }


        .cart-button {
            border-radius: 25px;
            font-weight: 600;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            background: #212529;
            color: white;
            padding: 70px 20px;
        }


        .hero h1 {
            font-size: 48px;
            font-weight: 800;
        }


        .hero p {
            font-size: 19px;
            color: #ced4da;
        }


        /* =========================
           SEARCH
        ========================= */

        .search-section {
            margin-top: -25px;
            position: relative;
            z-index: 2;
        }


        .search-box {
            background: white;
            border-radius: 14px;
            padding: 18px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.10);
        }


        .search-input {
            border-radius: 10px;
            padding: 13px 16px;
            font-size: 16px;
        }


        .search-result {
            color: #6c757d;
            font-size: 14px;
            margin-top: 8px;
        }


        /* =========================
           PRODUCT CARDS
        ========================= */

        .product-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.2s;
        }


        .product-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.12) !important;
        }


        .product-image {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }


        .no-image {
            height: 230px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e9ecef;

            color: #6c757d;

            font-size: 18px;
        }


        .product-name {
            font-weight: 700;
        }


        .product-price {
            color: #0d6efd;
            font-size: 22px;
            font-weight: 700;
        }


        .out-of-stock {
            opacity: 0.65;
        }


        /* =========================
           CART
        ========================= */

        .cart-item {
            border-bottom: 1px solid #dee2e6;
            padding: 15px 0;
        }


        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .quantity-btn {
            width: 32px;
            height: 32px;

            padding: 0;

            border-radius: 50%;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 80px;
            padding: 30px;

            background: #212529;

            color: white;

            text-align: center;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 576px) {

            .hero {
                padding: 50px 20px;
            }


            .hero h1 {
                font-size: 36px;
            }


            .hero p {
                font-size: 17px;
            }


            .search-section {
                margin-top: -15px;
            }

        }

    </style>

</head>



<body>


<!-- =====================================
     NAVBAR
===================================== -->

<nav class="navbar navbar-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="#"
        >

            🍔 Shams Restaurant

        </a>



        <button
            class="btn btn-primary cart-button"
            onclick="openCart()"
        >

            🛒 Cart

            <span
                id="cart-count"
                class="badge bg-light text-dark ms-1"
            >
                0
            </span>

        </button>

    </div>

</nav>



<!-- =====================================
     HERO
===================================== -->

<section class="hero">

    <div class="container">

        <div class="row align-items-center">

            <div class="col-lg-8">

                <h1>

                    Fresh food,
                    made with love. ❤️

                </h1>


                <p class="mt-3 mb-0">

                    Delicious food from
                    Shams Restaurant,
                    made fresh for you.

                </p>

            </div>

        </div>

    </div>

</section>



<!-- =====================================
     MENU
===================================== -->

<main class="container py-5">


    <!-- SEARCH -->

    <div class="search-section mb-5">

        <div class="search-box">

            <label
                for="product-search"
                class="form-label fw-bold"
            >

                🔍 Search Food

            </label>


            <input
                type="text"
                id="product-search"
                class="form-control search-input"
                placeholder="Search for biryani, burger, roll..."
                autocomplete="off"
            >


            <div
                id="search-result"
                class="search-result"
            ></div>

        </div>

    </div>



    <!-- MENU TITLE -->

    <div class="mb-4">

        <h2 class="fw-bold">

            Our Menu

        </h2>


        <p class="text-muted">

            Choose your favourite food

        </p>

    </div>



    <!-- PRODUCTS -->

    <div
        id="products-container"
        class="row g-4"
    >

        <div class="col-12 text-center py-5">

            <div
                class="spinner-border text-primary"
                role="status"
            ></div>


            <p class="mt-3 text-muted">

                Loading menu...

            </p>

        </div>

    </div>


</main>



<!-- =====================================
     CART MODAL
===================================== -->

<div
    class="modal fade"
    id="cartModal"
    tabindex="-1"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <!-- HEADER -->

            <div class="modal-header">

                <h5 class="modal-title fw-bold">

                    🛒 Your Cart

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>



            <!-- BODY -->

            <div
                class="modal-body"
                id="cart-container"
            >

            </div>



            <!-- FOOTER -->

            <div class="modal-footer">

                <div class="me-auto">

                    <strong>
                        Total:
                    </strong>


                    <span
                        id="cart-total"
                        class="text-primary fw-bold"
                    >
                        ₹0
                    </span>

                </div>



                <button
                    class="btn btn-success"
                    onclick="checkout()"
                >

                    Checkout

                </button>

            </div>


        </div>

    </div>

</div>



<!-- =====================================
     FOOTER
===================================== -->

<footer>

    <p class="mb-0">

        🍔 Shams Restaurant

    </p>


    <small class="text-secondary">

        Fresh food, made with love.

    </small>

</footer>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>



<script>


// =====================================
// API
// =====================================

const API_URL =
    "/api/products";



// =====================================
// CART
// =====================================

let cart = [];



// =====================================
// PRODUCTS
// =====================================

let allProducts = [];



// =====================================
// CART MODAL
// =====================================

let cartModal;



// =====================================
// LOAD PRODUCTS
// =====================================

async function loadProducts() {


    const container =
        document.getElementById(
            "products-container"
        );


    try {


        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Failed to load products"
            );

        }


        const products =
            await response.json();


        allProducts =
            products.filter(
                function(product) {

                    return product.available;

                }
            );


        renderProducts(
            allProducts
        );


    } catch (error) {


        console.error(error);


        container.innerHTML = `

            <div class="col-12">

                <div class="alert alert-danger text-center">

                    ❌ Could not load menu.

                    <br>

                    Please try again later.

                </div>

            </div>

        `;

    }

}



// =====================================
// RENDER PRODUCTS
// =====================================

function renderProducts(products) {


    const container =
        document.getElementById(
            "products-container"
        );


    const result =
        document.getElementById(
            "search-result"
        );


    container.innerHTML = "";



    // NO PRODUCTS

    if (products.length === 0) {


        result.textContent =
            "No matching food items found.";


        container.innerHTML = `

            <div class="col-12">

                <div class="alert alert-warning text-center">

                    🔍 No food items match your search.

                </div>

            </div>

        `;


        return;

    }



    // SEARCH RESULT

    const searchValue =
        document.getElementById(
            "product-search"
        ).value.trim();


    if (searchValue) {

        result.textContent =
            `${products.length} food item${
                products.length === 1
                    ? ""
                    : "s"
            } found`;

    } else {

        result.textContent =
            `${products.length} food items available`;

    }



    // CREATE CARDS

    products.forEach(
        function(product) {


            const productDiv =
                document.createElement(
                    "div"
                );


            productDiv.className =
                "col-md-6 col-lg-4";


            const imageHTML =
                product.image

                ? `

                    <img
                        src="${escapeAttribute(product.image)}"
                        class="product-image"
                        alt="${escapeAttribute(product.name)}"
                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='flex';
                        "
                    >

                    <div
                        class="no-image"
                        style="display:none;"
                    >

                        🍔 Image unavailable

                    </div>

                `

                : `

                    <div class="no-image">

                        🍔 No Image

                    </div>

                `;



            productDiv.innerHTML = `

                <div
                    class="card product-card shadow-sm h-100"
                >


                    ${imageHTML}



                    <div
                        class="card-body d-flex flex-column"
                    >


                        <h4 class="product-name">

                            ${escapeHTML(product.name)}

                        </h4>



                        <div class="product-price mb-3">

                            ₹${Number(product.price).toFixed(2)}

                        </div>



                        <div class="mb-3">

                            <span class="badge bg-success">

                                Available

                            </span>

                        </div>



                        <button
                            class="btn btn-primary mt-auto"
                            onclick='addToCart(${JSON.stringify(product)})'
                        >

                            🛒 Add to Cart

                        </button>


                    </div>


                </div>

            `;


            container.appendChild(
                productDiv
            );

        }
    );

}



// =====================================
// SEARCH
// =====================================

function searchProducts() {


    const searchInput =
        document.getElementById(
            "product-search"
        );


    const searchTerm =
        searchInput.value
            .trim()
            .toLowerCase();



    const filteredProducts =
        allProducts.filter(
            function(product) {

                return product.name
                    .toLowerCase()
                    .includes(searchTerm);

            }
        );



    renderProducts(
        filteredProducts
    );

}



// =====================================
// ADD TO CART
// =====================================

function addToCart(product) {


    const existing =
        cart.find(
            function(item) {

                return item._id === product._id;

            }
        );



    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            _id: product._id,

            name: product.name,

            price: product.price,

            image: product.image,

            quantity: 1

        });

    }



    // Save cart

    saveCart();



    updateCartCount();


    showToast(
        `${product.name} added to cart! 🛒`
    );

}



// =====================================
// SAVE CART
// =====================================

function saveCart() {

    localStorage.setItem(
        "shamsCart",
        JSON.stringify(cart)
    );

}



// =====================================
// LOAD CART
// =====================================

function loadCart() {

    try {

        const savedCart =
            localStorage.getItem(
                "shamsCart"
            );


        if (savedCart) {

            cart =
                JSON.parse(savedCart);

        }

    } catch (error) {

        cart = [];

    }


    updateCartCount();

}



// =====================================
// UPDATE CART COUNT
// =====================================

function updateCartCount() {


    const count =
        cart.reduce(
            function(total, item) {

                return total + item.quantity;

            },
            0
        );


    document.getElementById(
        "cart-count"
    ).textContent = count;

}



// =====================================
// OPEN CART
// =====================================

function openCart() {


    renderCart();


    cartModal.show();

}



// =====================================
// RENDER CART
// =====================================

function renderCart() {


    const container =
        document.getElementById(
            "cart-container"
        );


    const totalElement =
        document.getElementById(
            "cart-total"
        );



    if (cart.length === 0) {


        container.innerHTML = `

            <div class="text-center py-5">

                <div style="font-size:50px;">
                    🛒
                </div>


                <h5 class="mt-3">

                    Your cart is empty

                </h5>


                <p class="text-muted">

                    Add some delicious food!

                </p>

            </div>

        `;


        totalElement.textContent =
            "₹0";


        return;

    }



    container.innerHTML = "";


    let total = 0;



    cart.forEach(
        function(item, index) {


            const itemTotal =
                item.price *
                item.quantity;


            total += itemTotal;



            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "cart-item";


            div.innerHTML = `

                <div class="row align-items-center">


                    <div class="col-7">

                        <h6 class="fw-bold mb-1">

                            ${escapeHTML(item.name)}

                        </h6>


                        <small class="text-muted">

                            ₹${item.price} each

                        </small>

                    </div>



                    <div class="col-5">


                        <div
                            class="d-flex align-items-center justify-content-end gap-2"
                        >


                            <button
                                class="btn btn-outline-secondary quantity-btn"
                                onclick="decreaseQuantity(${index})"
                            >
                                −
                            </button>


                            <strong>

                                ${item.quantity}

                            </strong>


                            <button
                                class="btn btn-outline-secondary quantity-btn"
                                onclick="increaseQuantity(${index})"
                            >
                                +
                            </button>


                            <button
                                class="btn btn-outline-danger btn-sm"
                                onclick="removeFromCart(${index})"
                            >
                                🗑️
                            </button>


                        </div>



                        <div class="text-end mt-2">

                            <strong>

                                ₹${itemTotal}

                            </strong>

                        </div>


                    </div>


                </div>

            `;


            container.appendChild(
                div
            );

        }
    );



    totalElement.textContent =
        `₹${total}`;

}



// =====================================
// INCREASE QUANTITY
// =====================================

function increaseQuantity(index) {


    cart[index].quantity++;


    saveCart();


    updateCartCount();


    renderCart();

}



// =====================================
// DECREASE QUANTITY
// =====================================

function decreaseQuantity(index) {


    if (
        cart[index].quantity > 1
    ) {

        cart[index].quantity--;

    } else {

        cart.splice(
            index,
            1
        );

    }


    saveCart();


    updateCartCount();


    renderCart();

}



// =====================================
// REMOVE ITEM
// =====================================

function removeFromCart(index) {


    cart.splice(
        index,
        1
    );


    saveCart();


    updateCartCount();


    renderCart();

}



// =====================================
// CHECKOUT
// =====================================

function checkout() {


    if (cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;

    }


    // Make sure latest cart is saved

    saveCart();


    // Go to checkout page

    window.location.href =
        "checkout.html";

}



// =====================================
// TOAST
// =====================================

function showToast(message) {


    const toast =
        document.createElement(
            "div"
        );


    toast.textContent =
        message;


    toast.style.position =
        "fixed";


    toast.style.bottom =
        "25px";


    toast.style.right =
        "25px";


    toast.style.background =
        "#212529";


    toast.style.color =
        "white";


    toast.style.padding =
        "12px 18px";


    toast.style.borderRadius =
        "8px";


    toast.style.zIndex =
        "9999";


    toast.style.boxShadow =
        "0 5px 20px rgba(0,0,0,0.2)";


    document.body.appendChild(
        toast
    );


    setTimeout(
        function() {

            toast.remove();

        },
        2000
    );

}



// =====================================
// ESCAPE HTML
// =====================================

function escapeHTML(text) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}



// =====================================
// ESCAPE ATTRIBUTE
// =====================================

function escapeAttribute(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}



// =====================================
// START
// =====================================

document.addEventListener(
    "DOMContentLoaded",
    function() {


        cartModal =
            new bootstrap.Modal(
                document.getElementById(
                    "cartModal"
                )
            );


        // Search

        document
            .getElementById(
                "product-search"
            )
            .addEventListener(
                "input",
                searchProducts
            );


        // Load saved cart

        loadCart();


        // Load products

        loadProducts();

    }
);

</script>


</body>

</html>
