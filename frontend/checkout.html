<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Shams Food Stall</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f6f6fa;
            --card: #ffffff;
            --text: #1d1f2b;
            --muted: #6b7280;
            --border: #e5e7eb;

            --dark: #14151f;
            --orange: #ff7a1a;
            --orange-dark: #e56608;
            --green: #16a34a;
            --green-dark: #15803d;
            --red: #e11d48;
            --red-dark: #be123c;

            --radius: 18px;
            --shadow: 0 4px 20px rgba(20, 21, 31, 0.07);
            --shadow-lg: 0 10px 30px rgba(20, 21, 31, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        /* ================= CLOSED BANNER ================= */

        .closed-banner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(90deg, var(--red-dark), var(--red));
            color: white;
            text-align: center;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
        }

        body.is-closed .closed-banner {
            display: flex;
        }

        /* ================= HEADER ================= */

        header {
            background: var(--dark);
            color: white;
            padding: 16px 20px;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.25);
        }

        .header-inner {
            max-width: 1050px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--orange), #ffb347);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .brand h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        .back-btn:hover {
            background: var(--orange);
        }

        /* ================= LAYOUT ================= */

        .container {
            max-width: 1050px;
            margin: 32px auto 60px;
            padding: 0 16px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 26px;
        }

        .page-title h2 {
            font-size: 28px;
            font-weight: 700;
        }

        .page-title p {
            color: var(--muted);
            font-size: 15px;
            margin-top: 4px;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 26px;
            align-items: start;
        }

        .box {
            background: var(--card);
            padding: 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .box h3 {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .summary-box {
            position: sticky;
            top: 20px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 13px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #fafafa;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        input:focus,
        textarea:focus {
            border-color: var(--orange);
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 122, 26, 0.12);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .section-divider {
            margin: 30px 0 20px;
        }

        .address-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .required {
            color: var(--red);
        }

        /* ================= ORDER SUMMARY ================= */

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px dashed var(--border);
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-badge {
            min-width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #fff1e6;
            color: var(--orange-dark);
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-name {
            font-weight: 600;
            font-size: 15px;
        }

        .item-details {
            color: var(--muted);
            font-size: 13px;
            margin-top: 2px;
        }

        .item-price {
            font-weight: 600;
            white-space: nowrap;
        }

        .total-row {
            margin-top: 16px;
            padding: 16px 18px;
            border-radius: 14px;
            background: #fff7f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: 700;
        }

        .total-row span:last-child {
            color: var(--orange);
        }

        /* ================= PLACE ORDER BUTTON ================= */

        .place-order-btn {
            width: 100%;
            margin-top: 22px;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(22, 163, 74, 0.3);
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .place-order-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 26px rgba(22, 163, 74, 0.45);
        }

        .place-order-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .place-order-btn:disabled {
            background: #9ca3af;
            box-shadow: none;
            cursor: not-allowed;
        }

        body.is-closed .place-order-btn:disabled {
            background: var(--red);
            opacity: 0.85;
        }

        /* ================= EMPTY CART ================= */

        .empty-cart {
            text-align: center;
            padding: 30px 10px;
            color: var(--muted);
        }

        .empty-cart .empty-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .empty-cart a {
            display: inline-block;
            margin-top: 16px;
            text-decoration: none;
            background: var(--orange);
            color: white;
            padding: 11px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
        }

        .empty-cart a:hover {
            background: var(--orange-dark);
        }

        /* ================= MESSAGE ================= */

        .message {
            display: none;
            padding: 14px 16px;
            margin-bottom: 22px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
        }

        .message.error {
            background: #ffe4e8;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        .message.success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }

            /* show the order summary first on phones */
            .summary-box {
                order: -1;
                position: static;
            }
        }

        @media (max-width: 520px) {
            .address-grid {
                grid-template-columns: 1fr;
            }

            .box {
                padding: 20px;
            }

            .brand h1 {
                font-size: 16px;
            }

            .back-btn {
                padding: 9px 14px;
                font-size: 13px;
            }

            .page-title h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="closed-banner">
    🔴 Sorry, we're <strong>closed right now</strong>. You can't place an order at the moment.
</div>

<header>
    <div class="header-inner">

        <div class="brand">
            <div class="brand-logo">🍔</div>
            <h1>Shams Food Stall</h1>
        </div>

        <a href="index.html" class="back-btn">
            ← Back to Menu
        </a>

    </div>
</header>

<div class="container">

    <div class="page-title">
        <h2>Checkout</h2>
        <p>Almost there! Fill in your details to place the order.</p>
    </div>

    <div id="message" class="message"></div>

    <div class="checkout-grid">

        <!-- CUSTOMER DETAILS -->

        <div class="box">

            <h3>👤 Customer Details</h3>

            <form id="checkoutForm">

                <div class="form-group">
                    <label for="name">
                        Full Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">
                        Phone Number <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        inputmode="tel"
                        required
                    >
                </div>

                <h3 class="section-divider">📍 Delivery Address</h3>

                <div class="address-grid">

                    <div class="form-group">
                        <label for="house">
                            House / Flat No. <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="house"
                            placeholder="House / Flat"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="pincode">
                            Pincode <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            placeholder="Pincode"
                            inputmode="numeric"
                            autocomplete="postal-code"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="street">
                        Street / Area <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="street"
                        placeholder="Street, area or landmark"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="city">
                        City <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="City"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="note">
                        Order Note
                    </label>

                    <textarea
                        id="note"
                        placeholder="Any special instructions? (Optional)"
                    ></textarea>
                </div>

                <button
                    type="submit"
                    id="placeOrderBtn"
                    class="place-order-btn"
                >
                    Place Order
                </button>

            </form>

        </div>

        <!-- ORDER SUMMARY -->

        <div class="box summary-box">

            <h3>🛒 Your Order</h3>

            <div id="orderItems"></div>

            <div class="total-row">
                <span>Total</span>
                <span id="orderTotal">₹0</span>
            </div>

        </div>

    </div>

</div>

<script>
    const API = "/api";

    const CART_KEY = "shamsCart";

    const form = document.getElementById("checkoutForm");
    const orderItems = document.getElementById("orderItems");
    const orderTotal = document.getElementById("orderTotal");
    const message = document.getElementById("message");
    const placeOrderBtn = document.getElementById("placeOrderBtn");

    let cart = [];

    let storeOpen = true;

    let isPlacing = false;

    /* =========================================
       STORE OPEN / CLOSED
       ========================================= */

    function updateOrderButton() {
        document.body.classList.toggle(
            "is-closed",
            !storeOpen
        );

        if (isPlacing) {
            placeOrderBtn.disabled = true;
            placeOrderBtn.textContent = "Placing Order...";
            return;
        }

        if (!storeOpen) {
            placeOrderBtn.disabled = true;
            placeOrderBtn.textContent = "🔴 Restaurant is Closed";
            return;
        }

        placeOrderBtn.disabled = cart.length === 0;
        placeOrderBtn.textContent = "Place Order";
    }

    async function loadStoreStatus() {
        try {
            const response = await fetch(
                `${API}/store-status`,
                { cache: "no-store" }
            );

            if (!response.ok) {
                return;
            }

            const data = await response.json();

            storeOpen = data.isOpen !== false;

            updateOrderButton();
        } catch (error) {
            /*
               If the check fails we do not block the customer.
               The server still refuses orders while closed.
            */
            console.error("Store status error:", error);
        }
    }

    /* =========================================
       LOAD CART
       ========================================= */

    function loadCart() {
        try {
            const savedCart = localStorage.getItem(CART_KEY);

            cart = savedCart
                ? JSON.parse(savedCart)
                : [];
        } catch (error) {
            console.error("Cart loading error:", error);
            cart = [];
        }

        if (!Array.isArray(cart)) {
            cart = [];
        }

        renderCart();
    }

    /* =========================================
       RENDER CART
       ========================================= */

    function renderCart() {
        orderItems.innerHTML = "";

        if (cart.length === 0) {
            orderItems.innerHTML = `
                <div class="empty-cart">
                    <div class="empty-icon">🛒</div>

                    <p>Your cart is empty.</p>

                    <a href="index.html">
                        Go to Menu
                    </a>
                </div>
            `;

            orderTotal.textContent = "₹0";

            updateOrderButton();

            return;
        }

        let total = 0;

        cart.forEach((item) => {
            const quantity = Number(item.quantity) || 1;
            const price = Number(item.price) || 0;

            const itemTotal = price * quantity;

            total += itemTotal;

            const div = document.createElement("div");

            div.className = "order-item";

            div.innerHTML = `
                <div class="item-left">
                    <div class="qty-badge">
                        ${quantity}×
                    </div>

                    <div>
                        <div class="item-name">
                            ${escapeHtml(item.name || "Product")}
                        </div>

                        <div class="item-details">
                            ₹${price.toFixed(2)} each
                        </div>
                    </div>
                </div>

                <div class="item-price">
                    ₹${itemTotal.toFixed(2)}
                </div>
            `;

            orderItems.appendChild(div);
        });

        orderTotal.textContent =
            "₹" + total.toFixed(2);

        updateOrderButton();
    }

    /* =========================================
       CALCULATE TOTAL
       ========================================= */

    function calculateTotal() {
        return cart.reduce((total, item) => {
            const price = Number(item.price) || 0;
            const quantity = Number(item.quantity) || 1;

            return total + price * quantity;
        }, 0);
    }

    /* =========================================
       HTML ESCAPE
       ========================================= */

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    /* =========================================
       SHOW MESSAGE
       ========================================= */

    function showMessage(text, type) {
        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display = "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    /* =========================================
       HIDE MESSAGE
       ========================================= */

    function hideMessage() {
        message.style.display = "none";
    }

    /* =========================================
       PLACE ORDER
       ========================================= */

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        hideMessage();

        if (!storeOpen) {
            showMessage(
                "Sorry, the restaurant is closed right now. Please try again later.",
                "error"
            );

            return;
        }

        if (cart.length === 0) {
            showMessage(
                "Your cart is empty.",
                "error"
            );

            return;
        }

        const name =
            document.getElementById("name")
                .value.trim();

        const phone =
            document.getElementById("phone")
                .value.trim();

        const house =
            document.getElementById("house")
                .value.trim();

        const street =
            document.getElementById("street")
                .value.trim();

        const city =
            document.getElementById("city")
                .value.trim();

        const pincode =
            document.getElementById("pincode")
                .value.trim();

        const note =
            document.getElementById("note")
                .value.trim();

        if (
            !name ||
            !phone ||
            !house ||
            !street ||
            !city ||
            !pincode
        ) {
            showMessage(
                "Please fill in all required fields.",
                "error"
            );

            return;
        }

        const total = calculateTotal();

        if (total <= 0) {
            showMessage(
                "Invalid order total.",
                "error"
            );

            return;
        }

        const items = cart.map((item) => ({
            productId: item.productId || item._id,
            name: item.name,
            price: Number(item.price),
            quantity: Number(item.quantity) || 1
        }));

        const orderData = {
            customer: {
                name,
                phone
            },

            address: {
                house,
                street,
                city,
                pincode
            },

            note,

            items,

            total
        };

        isPlacing = true;

        updateOrderButton();

        try {
            const response = await fetch(
                `${API}/orders`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(orderData)
                }
            );

            const data = await response.json();

            if (!response.ok) {
                /*
                   The restaurant was closed by the admin
                   after this page was opened.
                */
                if (data.closed) {
                    storeOpen = false;
                }

                throw new Error(
                    data.message ||
                    "Failed to place order"
                );
            }

            /* -----------------------------
               CLEAR CART
               ----------------------------- */

            localStorage.removeItem(CART_KEY);

            /* -----------------------------
               SAVE ORDER FOR SUCCESS PAGE
               ----------------------------- */

            localStorage.setItem(
                "shamsLastOrder",
                JSON.stringify(data.order)
            );

            /* -----------------------------
               GO TO SUCCESS PAGE
               ----------------------------- */

            window.location.href =
                "success.html";

        } catch (error) {
            console.error(
                "Place order error:",
                error
            );

            showMessage(
                error.message ||
                "Something went wrong. Please try again.",
                "error"
            );

            isPlacing = false;

            updateOrderButton();
        }
    });

    /* =========================================
       START
       ========================================= */

    loadCart();

    loadStoreStatus();

    /* keep the closed / open state fresh */
    setInterval(loadStoreStatus, 10000);
</script>

</body>
</html>
